# Harness v4 Configuration
# Edit this file, then run `harness sync` to generate CC plugin files.

[project]
name = "homelab"
version = "0.1.0"
description = "Homelab IaC: Terraform + NixOS + Kubernetes (ArgoCD)"

[agent]
# default = "security-reviewer"

[env]
# CLAUDE_CODE_SUBPROCESS_ENV_SCRUB = "1"

[safety.permissions]
deny = [
  "Bash(sudo:*)",
]
# ask は使わない。ヘッドレスの定期実行（ops/CHARTER.md）では誰も承認できず、
# プロンプトに当たった時点でその起動が丸ごと無駄になるため。
# 止めたいものは deny に、それ以外は CI と ArgoCD 経由の変更経路で担保する。
ask = []

[safety.sandbox]
failIfUnavailable = false

[safety.sandbox.filesystem]
# denyRead = [".env", "secrets/**"]
# allowRead = [".env.example"]

