# private-data 分離 Job のテンプレート断片 (参考。ArgoCD には適用されない)。
#
# 実際の private-data Job は ops/heart/spawn.py が組み立てる。PROJECT.md (仕様 JSON)
# の capabilities に "private-data" を宣言すると、spawn.py が下記 template.metadata.labels
# と同等のラベルを Pod に付け、NetworkPolicy private-data-egress-lock の選択対象になる。
# このファイルは「手で Job を書くときの形」を固定する参照であり、apps/ 配下に置くと
# ArgoCD が実物として適用するので置かない。
#
# 脅威モデルと運用条件は同ディレクトリの README.md。
apiVersion: batch/v1
kind: Job
metadata:
  name: private-data-job-template
  namespace: autopilot
  annotations:
    homelab.hikuohiku.dev/note: >-
      reference-only fragment — real jobs are built by ops/heart/spawn.py
      (capability "private-data" adds this label automatically)
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 21600
  template:
    metadata:
      # NetworkPolicy private-data-egress-lock の選択キー。この 1 行が本体。
      labels:
        private-data: "true"
    spec:
      restartPolicy: Never
      # 私的データを読む Pod にクラスタへの書き込み権限は要らないのが普通。
      # トークンも mount しない (k8s API への出口は NP 側でも塞がっているが、
      # 深層防御としてここでも断つ)
      serviceAccountName: autopilot-runner
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: worker
          # python:3.14-alpine の OCI index digest pin (exfil_drill.py IMAGE と同じ値。
          # 上げ方・実測手順は同ファイルのコメント参照)。
          # livenessProbe/readinessProbe を付けないこと — 本プロファイルは
          # ingress 全拒否なので probe が誤検知する
          image: python@sha256:05b2b8b732ecd268fee8727a369f936f022d1321b59befd13c30ede22769dcdc
          command: ["python3", "-c", "pass"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: opencode-tmp
              mountPath: /tmp/opencode
      volumes:
        # イメージ焼き込みの /tmp/opencode は root:root 755 で runAsUser 10001
        # から不変 (P-0243 実測 — ドリルの --report 先がここで沈んだ)。fsGroup
        # 配下の emptyDir を載せて「書き込み可能な作業場」にする (spawn.py 同型)
        - name: opencode-tmp
          emptyDir:
            sizeLimit: 64Mi
