# P-0161: demo run 用の合成 (fake) メール fixture。
#
# ★★★ ここに入れるのは必ず合成データであること ★★★
#   - 実在のメール・実在の人物・本物の私的データを入れない (spec why「生活データには
#     一切触れない」)。ドメインは example.invalid / *.example.invalid のみ (.invalid TLD
#     は RFC 2606 が予約しており解決しない)。本文には [SYNTHETIC] マーカーを入れる —
#     ops/tests/test_private_data_profile.py がこの規約を機械検査する
#   - 本番の私的データを載せるときはこのファイルを使わない。Doppler + ExternalSecret
#     経由にする (Git に平文を置かない慣習)
#
# 適用は writer SA ではできない: autopilot-writer ClusterRole は意図的に secrets を
# 含まない (apps/autopilot/rbac.yaml「secrets と RBAC は含めない」)。demo run のときは
# 管理者 kubeconfig の kubectl CLI で apply し、撤収手順で必ず消す:
#
#     kubectl apply -f ops/profiles/private-data/secret-fixture.yaml
#     ... (demo run) ...
#     kubectl delete secret p0161-mail-fixture -n autopilot
#
# model コンテナからは /private-data/*.eml として readOnly mount される (job.yaml 参照)。
apiVersion: v1
kind: Secret
metadata:
  name: p0161-mail-fixture
  namespace: autopilot
  labels:
    app.kubernetes.io/part-of: p0161-private-data-profile
type: Opaque
stringData:
  mail_001.eml: |
    From: Yuki Hanada <yuki@example.invalid>
    To: me@example.invalid
    Subject: [SYNTHETIC] 日曜のランチの件
    Date: Sat, 22 Aug 2026 09:12:00 +0900
    Message-ID: <synthetic-001@example.invalid>

    [SYNTHETIC FIXTURE] これは分離 Job プロファイル (P-0161) の実験用に作った
    偽のメールです。実在の人物・出来事とは無関係で、受信もしていません。

    本文は要約成果物に入りません。差出人と件名だけが digest に流れます。
  mail_002.eml: |
    From: Dental Clinic Sakura <noreply@dental.example.invalid>
    To: me@example.invalid
    Subject: [SYNTHETIC] ご予約確認のお願い
    Date: Sat, 22 Aug 2026 14:40:00 +0900
    Message-ID: <synthetic-002@dental.example.invalid>

    [SYNTHETIC FIXTURE] 偽の予約確認メールです。実在の歯科医院とは無関係です。

    次回のご予約は来週火曜 10:30 です (これは偽の情報であり、実際の予定ではありません)。
  mail_003.eml: |
    From: Newsletter <bulletin@news.example.invalid>
    To: me@example.invalid
    Subject: [SYNTHETIC] 今週のおすすめ記事
    Date: Sun, 23 Aug 2026 06:00:00 +0900
    Message-ID: <synthetic-003@news.example.invalid>

    [SYNTHETIC FIXTURE] 偽のメルマガです。実在のサービスとは無関係です。

    信頼できない外部コンテンツが model コンテナ内で消費され、出力へは
    メタ情報だけが流れることを確認するための第 3 通目です。
