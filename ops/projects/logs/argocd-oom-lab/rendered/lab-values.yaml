global:
  domain: argocd-lab.local
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  enabled: false
server:
  enabled: false
configs:
  params:
    server.insecure: true
    controller.repo.server.plaintext: "true"
controller:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi
redis:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
