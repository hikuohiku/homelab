name: Direct Push Guard

# 現在 main の ruleset「CI 必須」は bypass を空にしてあり、required status checks が
# main への直 push 自体を拒否する（GH013）。つまり平常時にこのジョブが実行される機会は無い。
# このワークフローは、人間が強制マージ等のために enforcement を一時的に緩めた場合の
# backstop として残している（issue #56 のレビューで「開いている穴を塞ぐもの」という
# 前提が誤りだったと指摘され、位置付けを修正した）。
# 発火したら: 直 push（マージされた PR に紐付かないコミット）で ops/ 以外のファイルが
# 変更されていたら、このジョブを失敗させ、フィードバック issue にコメントして次の
# autopilot 起動が気づけるようにする。

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: direct-push-guard-${{ github.sha }}
  cancel-in-progress: false

jobs:
  guard:
    name: detect direct push outside ops/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine if this commit came from a merged PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_merged=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq 'map(select(.merged_at != null)) | length > 0')
          # commits/{sha}/pulls はマージ直後に反映が間に合わず空を返すことがある（issue #56）。
          # このリポジトリは merge commit のみ許可されている（squash/rebase 禁止）ため、
          # マージコミットのメッセージからも判定し、どちらかが true なら PR 由来とみなす
          msg_merged=false
          if git log -1 --format=%s "${{ github.sha }}" | grep -qE '^Merge pull request #[0-9]+ from '; then
            msg_merged=true
          fi
          if [ "$api_merged" = "true" ] || [ "$msg_merged" = "true" ]; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: List changed files outside ops/
        id: files
        if: steps.pr.outputs.merged == 'false'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            range="HEAD~1..HEAD"
          else
            range="${BEFORE}..HEAD"
          fi
          # git diff が失敗したら（force-push で BEFORE が失効した等）握り潰さずジョブを
          # 失敗させる。差分が取れないまま success 扱いにすると検知が静かに素通りする（issue #56）
          git diff --name-only $range > changed.txt
          grep -v '^ops/' changed.txt > outside.txt || true
          {
            echo "list<<GUARD_EOF"
            cat outside.txt
            echo "GUARD_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fail and alert on direct push
        if: steps.pr.outputs.merged == 'false' && steps.files.outputs.list != ''
        env:
          GH_TOKEN: ${{ github.token }}
          OUTSIDE_FILES: ${{ steps.files.outputs.list }}
        run: |
          set -euo pipefail
          echo "::error::main への直 push で ops/ 以外のファイルが変更されました（CI 未通過）"
          echo "$OUTSIDE_FILES"
          gh issue comment 56 --repo "${{ github.repository }}" --body "**direct-push-guard が main への直 push を検知しました。**

          commit: ${{ github.sha }}
          変更ファイル（ops/ 以外）:
          \`\`\`
          $OUTSIDE_FILES
          \`\`\`

          CI（kustomize build / terraform validate / ops state validate）を経由していない変更が main に入っています。内容を確認してください。"
          exit 1
