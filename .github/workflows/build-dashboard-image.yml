name: Build dashboard image

# Initial release is intentionally two-stage: merge the application first, measure the
# published SHA tag's OCI index digest, then pin that digest in apps/ops-dashboard/deployment.yaml.
on:
  push:
    branches: [main]
    paths:
      - "apps/ops-dashboard/app/**"
      - ".github/workflows/build-dashboard-image.yml"
  pull_request:
    paths:
      - "apps/ops-dashboard/app/**"
      - ".github/workflows/build-dashboard-image.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/homelab-dashboard

jobs:
  build:
    name: build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: apps/ops-dashboard/app
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image reference
        if: github.event_name != 'pull_request'
        run: |
          echo "::notice title=dashboard image::${{ env.IMAGE }}:${{ github.sha }}"
