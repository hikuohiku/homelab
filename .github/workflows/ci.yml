name: CI

# autopilot が出す PR の auto-merge ゲート。
# ここが green であることが、人間のレビュー無しにマージしてよい根拠になる。
# 検証できない領域を増やしたら、必ずこの CI にも検証を足すこと（ops/CHARTER.md §4）。
#
# 2026-08-22: 5 並列ジョブ → 1 ジョブに統合。ランナー起動とツールインストールの
# 重複が wall clock の大半だったため。変更パスに応じて重いステップ (kustomize /
# terraform / nix) をスキップする。個人サーバーなので網羅より速度を優先する
# (人間の指示)。check run は常に「ci」1 つ + GitGuardian で、heart の
# checks_green 判定 (全 run が success) と両立する。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # PR は merge commit なので HEAD^1 が base。push (merge) も第一親との差分
          fetch-depth: 2

      - name: detect changed paths
        id: ch
        run: |
          set -euo pipefail
          files=$(git diff --name-only HEAD^1 2>/dev/null || git show --name-only --format= HEAD)
          echo "changed files:"; echo "$files"
          echo "apps=$(grep -q '^apps/' <<<"$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "tf=$(grep -q '^terraform/' <<<"$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "nix=$(grep -qE '^(nix/|flake\.)' <<<"$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # --- ops (常に実行。純 Python で速い) ---

      - name: fetch origin/main for append-only check
        run: git fetch --no-tags --depth=1 origin main

      - name: ops state validate
        run: python3 ops/validate.py

      - name: unit tests (heart / runner / watchdog logic)
        run: |
          python3 -m unittest discover -s ops/heart/tests -t .
          python3 -m unittest discover -s ops/runner/tests -t .
          python3 -m unittest discover -s ops/tests -t .

      - name: consistency checks
        run: |
          python3 ops/check_version_sync.py
          python3 ops/check_pvc_usage_script_sync.py
          python3 ops/check_health_reporter_target.py
          python3 ops/check_doc_commands.py
          python3 ops/check_feedback.py
          python3 ops/dashboard/build.py

      # --- apps/ を触った PR だけ ---

      - uses: azure/setup-helm@v5
        with:
          version: v3.21.3
        # if を with の後に置くのは ops/check_version_sync.py の抽出正規表現
        # (uses 直後の with) を満たすため
        if: steps.ch.outputs.apps == 'true'

      - name: install kustomize
        if: steps.ch.outputs.apps == 'true'
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin kustomize

      - name: kustomize build (apps 変更時のみ)
        if: steps.ch.outputs.apps == 'true'
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r k; do
            d=$(dirname "$k")
            echo "::group::kustomize build $d"
            if kustomize build --enable-helm "$d" > /dev/null; then
              echo "ok"
            else
              echo "::error file=$k::kustomize build failed"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find apps -name kustomization.yaml | sort)
          exit $fail

      - name: standalone yaml parse (apps 変更時のみ)
        if: steps.ch.outputs.apps == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, pathlib
          try:
              import yaml
          except ImportError:
              sys.exit("PyYAML missing")
          bad = []
          for f in glob.glob("apps/**/*.yaml", recursive=True):
              if "/charts/" in f:
                  continue
              try:
                  list(yaml.safe_load_all(pathlib.Path(f).read_text()))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("\n".join(f"::error file={b.split(':')[0]}::{b}" for b in bad))
              sys.exit(1)
          print("all yaml parses")
          PY

      - uses: actions/checkout@v7
        if: steps.ch.outputs.apps == 'true' && github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: _base

      - name: manifest deletion guard (apps 変更時のみ)
        # apps root Application は prune: true。render 結果からオブジェクトが消えると
        # 次の sync でクラスタからも消える（PVC ならデータごと）。
        if: steps.ch.outputs.apps == 'true' && github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > /tmp/pr_body.txt
          python3 ops/check_manifest_deletions.py _base . /tmp/pr_body.txt

      # --- terraform/ を触った PR だけ ---

      - uses: hashicorp/setup-terraform@v4
        if: steps.ch.outputs.tf == 'true'
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: terraform validate (terraform 変更時のみ)
        if: steps.ch.outputs.tf == 'true'
        run: |
          terraform fmt -check -recursive -diff
          cd terraform/proxmox
          terraform init -backend=false -input=false
          terraform validate

      # --- nix/ を触った PR だけ (ビルドチェックは重いので該当時のみ) ---

      - uses: cachix/install-nix-action@v31
        if: steps.ch.outputs.nix == 'true'
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: nix flake check (nix 変更時のみ)
        if: steps.ch.outputs.nix == 'true'
        working-directory: nix/images/proxmox-cloud
        run: nix flake check --no-build --print-build-logs
