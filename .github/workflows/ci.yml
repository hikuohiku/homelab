name: CI

# autopilot が出す PR の auto-merge ゲート。
# ここが green であることが、人間のレビュー無しにマージしてよい根拠になる。
# 検証できない領域を増やしたら、必ずこの CI にも検証を足すこと（ops/CHARTER.md §4）。

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifests:
    name: kustomize build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin kustomize
          kustomize version

      - name: Build every kustomization
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r k; do
            d=$(dirname "$k")
            echo "::group::kustomize build $d"
            if kustomize build --enable-helm "$d" > /dev/null; then
              echo "ok"
            else
              echo "::error file=$k::kustomize build failed"
              fail=1
            fi
            echo "::endgroup::"
          done < <(find apps -name kustomization.yaml | sort)
          exit $fail

      - name: Validate standalone manifests parse
        # kustomization から参照されていない YAML（apps.yaml など）を拾う。
        # 直前の kustomize build が apps/*/charts/ に Helm chart を展開しているが、
        # 中身は Go テンプレートで YAML ではないので除外する。
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, sys, pathlib
          try:
              import yaml
          except ImportError:
              sys.exit("PyYAML missing")
          bad = []
          for f in glob.glob("apps/**/*.yaml", recursive=True):
              if "/charts/" in f:
                  continue
              try:
                  list(yaml.safe_load_all(pathlib.Path(f).read_text()))
              except Exception as e:
                  bad.append(f"{f}: {e}")
          if bad:
              print("\n".join(f"::error file={b.split(':')[0]}::{b}" for b in bad))
              sys.exit(1)
          print("all yaml parses")
          PY

  manifest-diff:
    name: manifest deletion guard
    # apps root Application は prune: true。render 結果からオブジェクトが消えると
    # 次の sync でクラスタからも消える（PVC ならデータごと）。base/head の render を
    # 比較し、消えたオブジェクトが PR 本文で明示的に許可されていなければ落とす
    # （ops/check_manifest_deletions.py, issue #56 2026-08-04 22:04:42）。
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          path: head

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install kustomize
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin kustomize
          kustomize version

      - name: Check for unexplained object deletions
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > /tmp/pr_body.txt
          python3 head/ops/check_manifest_deletions.py base head /tmp/pr_body.txt

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.0
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -check -recursive -diff

      - name: init & validate
        working-directory: terraform/proxmox
        run: |
          terraform init -backend=false -input=false
          terraform validate

  ops:
    name: ops state validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: validate
        run: python3 ops/validate.py
      - name: check duplicated version pins are in sync
        run: python3 ops/check_version_sync.py
      - name: dashboard build.py runs without error
        # index.html は生成物なので git 管理していない（T-0035）。壊れていないことだけここで担保する
        run: python3 ops/dashboard/build.py

  nix:
    name: nix flake check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # ビルド（qcow2 イメージの実体化）は重いので評価のみ。--no-build は今のところ no-op
      # （このフレークに checks 出力が無いため）だが、将来 checks が足された事故を防ぐ保険として付ける。
      - name: flake check (evaluation only)
        working-directory: nix/images/proxmox-cloud
        run: nix flake check --no-build --print-build-logs
