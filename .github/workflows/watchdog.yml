name: Watchdog

# 器が沈黙したことを、器の外側から気づくための口だったもの (P-0027)。
#
# **全ジョブが止まっている。** 沈黙の見張りはコアへ移った (#632): heart が Lease を
# 毎ビート更新し、コアがその鮮度を見て Telegram で人間に言う。読み先だった
# ops-state ブランチは 4b-2b で更新が止まったので、ここを動かすと誤報しか出ない。
# ファイルごとの撤去は Phase 7c (#636)。
#
# P-0211 で足した「ops-health-reporter 自身の死」の検知 (末尾 2 ステップ) は
# **止めてある** (if: false)。健全性レポートは GitHub の ops-health-report ブランチ
# ではなくクラスタ内の ConfigMap に移り (設計 docs/design/state-out-of-git Phase 5)、
# ここから読む先がもう無いため。鮮度の判定自体は失われていない — heart が
# ops/heart/facts.py:load_health() で generated_at を見て、古ければ health_fresh=False
# として soak を fail-closed に倒す。ステップと ops/check_health_freshness.py の撤去は
# Phase 7 (沈黙の通知をコア → Telegram へ移す段) でまとめて行う。
#
# **このワークフロー自身は CI の検証対象外**である (release-image.yml と同じ構図、
# ops/CHARTER.md §5.4)。壊れていても誰も落ちない = 静かに検知しなくなる。だから
# 変更したら workflow_dispatch (simulate_at に古い時刻) で 1 回実走させて確かめること。
# 判定ロジックそのものは ops/check_heartbeat_fresh.py にあり、ops/tests/ が CI で守る。

on:
  schedule:
    # 30 分毎。stale_seconds が 7200 (2h) なので、検知の遅れは最大でも 30 分。
    # 再投稿の抑止 (REPOST_COOLDOWN_SECONDS=6h) はスクリプト側が持つ
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      simulate_at:
        description: "heartbeat の at をこの ISO8601 で上書きする (訓練用。空なら実物を見る)"
        required: false
        default: ""
      dry_run:
        description: "コメントを投稿せず、本文を job summary に出すだけにする"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  heartbeat:
    name: heartbeat freshness
    # **止めてある** (設計 state-out-of-git 4b-2b)。heart は ops-state ブランチへの
    # push をやめたので、ここが読む heartbeat.json はもう更新されない。動かしたままだと
    # 30 分ごとに「沈黙している」と誤報し、issue #56 を偽の警報で埋める。
    #
    # 生存の見張りが消えたわけではない: heart は Lease
    # (coordination.k8s.io/autopilot-heart) を毎ビート更新し、コアがその鮮度を見て
    # Telegram で人間に言う (#632)。30 分ポーリングより速い。
    #
    # このワークフローと ops/check_heartbeat_fresh.py の撤去は Phase 7c (#636)。
    # 下の health 側 2 ステップが Phase 5 から同じ形で止まっているのと同じ扱い
    if: false
    runs-on: ubuntu-latest
    steps:
      # main 側の check_heartbeat_fresh.py と rules.json を使う。ops-state にも
      # 同じファイルのコピーはあるが、単一情報源は main
      - uses: actions/checkout@v7

      - name: Fetch heartbeat.json from ops-state
        # 失敗しても止めない。ブランチが消えた・空になったのも検知対象なので、
        # ファイルが無い状態でスクリプトに渡して fail-closed に判定させる。
        # FETCH_HEAD を使うので --single-branch の refspec 罠 (ops/memory/substrate.md) に当たらない
        run: |
          set -uo pipefail
          rm -f "$RUNNER_TEMP/heartbeat.json"
          if git fetch --no-tags --depth=1 origin ops-state; then
            if ! git show FETCH_HEAD:heartbeat.json > "$RUNNER_TEMP/heartbeat.json"; then
              rm -f "$RUNNER_TEMP/heartbeat.json"
              echo "::warning::ops-state に heartbeat.json が無い"
            fi
          else
            echo "::warning::ops-state ブランチを fetch できなかった"
          fi
          exit 0

      - name: Overwrite at with simulate_at (drill)
        if: inputs.simulate_at != ''
        env:
          SIMULATE_AT: ${{ inputs.simulate_at }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "heartbeat.json"
          try:
              doc = json.loads(p.read_text())
          except (OSError, ValueError):
              doc = {"beat": 0, "writer": "heart"}
          doc["at"] = os.environ["SIMULATE_AT"]
          p.write_text(json.dumps(doc))
          print(f"drill: at を {doc['at']} に上書きした")
          PY

      - name: Fetch recent comments on the feedback issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # lookback は必ず REPOST_COOLDOWN_SECONDS (6h) より長くすること。短いと
          # 「窓の外に自分のコメントがあったか」が分からず、抑止判定が常に不能になる
          # (check_heartbeat_fresh.should_post の comments_since 分岐)
          since=$(date -u -d '-48 hours' +%Y-%m-%dT%H:%M:%SZ)
          echo "COMMENTS_SINCE=$since" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/comments.json"
          # --paginate + --jq は 1 行 1 オブジェクトで出る。gh のバージョンによって
          # 配列の結合仕様が変わるので、JSONL にしてから自分で配列に組み直す
          if gh api "repos/${GITHUB_REPOSITORY}/issues/56/comments?per_page=100&since=${since}" \
              --paginate --jq '.[] | {created_at, body}' > "$RUNNER_TEMP/comments.jsonl"; then
            python3 - "$RUNNER_TEMP/comments.jsonl" "$RUNNER_TEMP/comments.json" <<'PY'
          import json, pathlib, sys
          src, dst = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          items = [json.loads(line) for line in src.read_text().splitlines() if line.strip()]
          dst.write_text(json.dumps(items))
          print(f"{len(items)} comments")
          PY
          else
            echo "::warning::issue #56 のコメントを取得できなかった"
          fi
          # 取れなかったときは空リストにして抑止なしで判定する (重複より沈黙の方が悪い)
          if [ ! -s "$RUNNER_TEMP/comments.json" ]; then
            echo "::warning::重複抑止なしで判定する"
            echo '[]' > "$RUNNER_TEMP/comments.json"
          fi
          exit 0

      - name: Check heartbeat freshness and alert
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          IS_DRILL: ${{ inputs.simulate_at != '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          drill=()
          if [ "${IS_DRILL}" = "true" ]; then drill=(--drill); fi

          set +e
          python3 ops/check_heartbeat_fresh.py \
            --file "$RUNNER_TEMP/heartbeat.json" \
            --comments-file "$RUNNER_TEMP/comments.json" \
            --comments-since "$COMMENTS_SINCE" \
            --body-out "$RUNNER_TEMP/body.md" \
            --run-url "$RUN_URL" \
            "${drill[@]+"${drill[@]}"}" | tee "$RUNNER_TEMP/verdict.txt"
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo "## watchdog: heartbeat"
            echo
            echo '```'
            cat "$RUNNER_TEMP/verdict.txt"
            echo "rc=$rc"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$rc" in
            0)
              echo "heartbeat は新しい。何もしない"
              ;;
            1)
              {
                echo
                echo "### 投稿する本文"
                echo
                cat "$RUNNER_TEMP/body.md"
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "${DRY_RUN}" = "true" ]; then
                echo "::warning::dry_run のためコメントは投稿しない"
              else
                gh issue comment 56 --repo "${GITHUB_REPOSITORY}" --body-file "$RUNNER_TEMP/body.md"
              fi
              echo "::error::heartbeat が古い。issue #56 を確認してください"
              exit 1
              ;;
            3)
              # 抑止中でもジョブは失敗させ続ける。検知が続いている事実は Actions 上に残す
              echo "::error::heartbeat が古いが、直近に同じ検知を投稿済みのためコメントは出さない"
              exit 1
              ;;
            *)
              echo "::error::check_heartbeat_fresh.py が想定外の rc=$rc で終了した (watchdog 自身の故障)"
              exit 1
              ;;
          esac

      # --- P-0211: ops-health-reporter 自身の死の検知 (heartbeat 検査では鳴らない) ---

      - name: Fetch latest.json from ops-health-report
        # Phase 5 で読み先が ConfigMap に移ったため停止中。撤去は Phase 7
        if: false
        # 失敗しても止めない。ブランチが消えた・空になったのも検知対象なので、
        # ファイルが無い状態でスクリプトに渡して fail-closed に判定させる。
        # FETCH_HEAD を使うので --single-branch の refspec 罠 (ops/memory/substrate.md) に当たらない
        run: |
          set -uo pipefail
          rm -f "$RUNNER_TEMP/latest.json"
          if git fetch --no-tags --depth=1 origin ops-health-report; then
            if ! git show FETCH_HEAD:ops/health/latest.json > "$RUNNER_TEMP/latest.json"; then
              rm -f "$RUNNER_TEMP/latest.json"
              echo "::warning::ops-health-report に ops/health/latest.json が無い"
            fi
          else
            echo "::warning::ops-health-report ブランチを fetch できなかった"
          fi
          exit 0

      - name: Check health-report freshness and alert
        # Phase 5 で読み先が ConfigMap に移ったため停止中。撤去は Phase 7
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          set +e
          python3 ops/check_health_freshness.py \
            "$RUNNER_TEMP/latest.json" \
            --body-out "$RUNNER_TEMP/health-body.md" \
            --run-url "$RUN_URL" | tee "$RUNNER_TEMP/health-verdict.txt"
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo
            echo "## watchdog: ops-health-report freshness"
            echo
            echo '```'
            cat "$RUNNER_TEMP/health-verdict.txt"
            echo "rc=$rc"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$rc" in
            0)
              echo "ops-health-report は新しい。何もしない"
              ;;
            3)
              {
                echo
                echo "### 投稿する本文 (ops-health-report 鮮度)"
                echo
                cat "$RUNNER_TEMP/health-body.md"
              } >> "$GITHUB_STEP_SUMMARY"

              # python3 -c のコードは run ブロックの base インデント (10 桁) で書く。
              # YAML が共通インデントを剥がしたあとに Python ソースとして列 0 に揃う
              # (heredoc は終端子を列 0 に置けず、case の内側では書けないため -c)
              python3 -c '
          import json, pathlib, sys
          verdict, out = (pathlib.Path(a) for a in sys.argv[1:3])
          text = (
              "[incident] ops-health-report ブランチの更新が古くなっています (外部 watchdog 検知)。"
              "ops-health-reporter の死で健全性情報が凍っている可能性があります。詳細は issue #56 へ。\n\n"
              + verdict.read_text()[:1200]
          )
          out.write_text(json.dumps({"content": text[:1900]}))
          ' "$RUNNER_TEMP/health-verdict.txt" "$RUNNER_TEMP/discord.json"

              if [ "${DRY_RUN}" = "true" ]; then
                echo "::warning::dry_run のためコメントは投稿しない"
              else
                gh issue comment 56 --repo "${GITHUB_REPOSITORY}" --body-file "$RUNNER_TEMP/health-body.md"
                # Discord は補助経路。webhook 未設定・送信失敗でも検知の報告 (issue コメントと
                # job fail) を止めない。curl なら UA 問題がない (Python urllib は Cloudflare に
                # 403 で弾かれる実測あり — ops/heart/notify.py)
                if [ -n "${DISCORD_WEBHOOK_URL:-}" ]; then
                  curl -fsS -X POST \
                    -H 'Content-Type: application/json' \
                    -H 'User-Agent: homelab-watchdog/1 (+https://github.com/hikuohiku/homelab)' \
                    --data-binary @"$RUNNER_TEMP/discord.json" "${DISCORD_WEBHOOK_URL}" \
                    || echo "::warning::Discord への通知に失敗した (issue コメントは出ている)"
                else
                  echo "::warning::DISCORD_WEBHOOK_URL が未設定のため Discord 通知をスキップ"
                fi
                echo "::error::ops-health-report ブランチが古い。issue #56 を確認してください"
                exit 1
              fi
              ;;
            *)
              echo "::error::check_health_freshness.py が想定外の rc=$rc で終了した (watchdog 自身の故障)"
              exit 1
              ;;
          esac
