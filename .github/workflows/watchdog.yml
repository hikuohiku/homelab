name: Watchdog

# 器が沈黙したことを、器の外側から気づくための唯一の口 (P-0027)。
#
# 今の生存確認は全部クラスタの内側にある — heart 自身が heartbeat.json を書き、
# ops-health-reporter CronJob が同じクラスタで読み、ダッシュボードも同じクラスタが配信する。
# heart / node01 / k3s のどれが死んでも、死んだと言う口ごと死ぬ。旧・細切れループは
# 「止まったまま死んだ」のに誰も気づかなかった (ops/VISION.md)。
# このワークフローは GitHub Actions (クラスタとは別の障害ドメイン) で回り、ops-state の
# heartbeat.json が ops/rules.json の heartbeat.stale_seconds を超えて古ければ、
# フィードバック issue #56 に人間宛のコメントを投稿してジョブを失敗させる。
#
# **このワークフロー自身は CI の検証対象外**である (release-image.yml と同じ構図、
# ops/CHARTER.md §5.4)。壊れていても誰も落ちない = 静かに検知しなくなる。だから
# 変更したら workflow_dispatch (simulate_at に古い時刻) で 1 回実走させて確かめること。
# 判定ロジックそのものは ops/check_heartbeat_fresh.py にあり、ops/tests/ が CI で守る。

on:
  schedule:
    # 30 分毎。stale_seconds が 7200 (2h) なので、検知の遅れは最大でも 30 分。
    # 再投稿の抑止 (REPOST_COOLDOWN_SECONDS=6h) はスクリプト側が持つ
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      simulate_at:
        description: "heartbeat の at をこの ISO8601 で上書きする (訓練用。空なら実物を見る)"
        required: false
        default: ""
      dry_run:
        description: "コメントを投稿せず、本文を job summary に出すだけにする"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  heartbeat:
    name: heartbeat freshness
    runs-on: ubuntu-latest
    steps:
      # main 側の check_heartbeat_fresh.py と rules.json を使う。ops-state にも
      # 同じファイルのコピーはあるが、単一情報源は main
      - uses: actions/checkout@v7

      - name: Fetch heartbeat.json from ops-state
        # 失敗しても止めない。ブランチが消えた・空になったのも検知対象なので、
        # ファイルが無い状態でスクリプトに渡して fail-closed に判定させる。
        # FETCH_HEAD を使うので --single-branch の refspec 罠 (ops/memory/substrate.md) に当たらない
        run: |
          set -uo pipefail
          rm -f "$RUNNER_TEMP/heartbeat.json"
          if git fetch --no-tags --depth=1 origin ops-state; then
            if ! git show FETCH_HEAD:heartbeat.json > "$RUNNER_TEMP/heartbeat.json"; then
              rm -f "$RUNNER_TEMP/heartbeat.json"
              echo "::warning::ops-state に heartbeat.json が無い"
            fi
          else
            echo "::warning::ops-state ブランチを fetch できなかった"
          fi
          exit 0

      - name: Overwrite at with simulate_at (drill)
        if: inputs.simulate_at != ''
        env:
          SIMULATE_AT: ${{ inputs.simulate_at }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["RUNNER_TEMP"]) / "heartbeat.json"
          try:
              doc = json.loads(p.read_text())
          except (OSError, ValueError):
              doc = {"beat": 0, "writer": "heart"}
          doc["at"] = os.environ["SIMULATE_AT"]
          p.write_text(json.dumps(doc))
          print(f"drill: at を {doc['at']} に上書きした")
          PY

      - name: Fetch recent comments on the feedback issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # lookback は必ず REPOST_COOLDOWN_SECONDS (6h) より長くすること。短いと
          # 「窓の外に自分のコメントがあったか」が分からず、抑止判定が常に不能になる
          # (check_heartbeat_fresh.should_post の comments_since 分岐)
          since=$(date -u -d '-48 hours' +%Y-%m-%dT%H:%M:%SZ)
          echo "COMMENTS_SINCE=$since" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/comments.json"
          # --paginate + --jq は 1 行 1 オブジェクトで出る。gh のバージョンによって
          # 配列の結合仕様が変わるので、JSONL にしてから自分で配列に組み直す
          if gh api "repos/${GITHUB_REPOSITORY}/issues/56/comments?per_page=100&since=${since}" \
              --paginate --jq '.[] | {created_at, body}' > "$RUNNER_TEMP/comments.jsonl"; then
            python3 - "$RUNNER_TEMP/comments.jsonl" "$RUNNER_TEMP/comments.json" <<'PY'
          import json, pathlib, sys
          src, dst = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          items = [json.loads(line) for line in src.read_text().splitlines() if line.strip()]
          dst.write_text(json.dumps(items))
          print(f"{len(items)} comments")
          PY
          else
            echo "::warning::issue #56 のコメントを取得できなかった"
          fi
          # 取れなかったときは空リストにして抑止なしで判定する (重複より沈黙の方が悪い)
          if [ ! -s "$RUNNER_TEMP/comments.json" ]; then
            echo "::warning::重複抑止なしで判定する"
            echo '[]' > "$RUNNER_TEMP/comments.json"
          fi
          exit 0

      - name: Check heartbeat freshness and alert
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          IS_DRILL: ${{ inputs.simulate_at != '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          drill=()
          if [ "${IS_DRILL}" = "true" ]; then drill=(--drill); fi

          set +e
          python3 ops/check_heartbeat_fresh.py \
            --file "$RUNNER_TEMP/heartbeat.json" \
            --comments-file "$RUNNER_TEMP/comments.json" \
            --comments-since "$COMMENTS_SINCE" \
            --body-out "$RUNNER_TEMP/body.md" \
            --run-url "$RUN_URL" \
            "${drill[@]+"${drill[@]}"}" | tee "$RUNNER_TEMP/verdict.txt"
          rc=${PIPESTATUS[0]}
          set -e

          {
            echo "## watchdog: heartbeat"
            echo
            echo '```'
            cat "$RUNNER_TEMP/verdict.txt"
            echo "rc=$rc"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          case "$rc" in
            0)
              echo "heartbeat は新しい。何もしない"
              ;;
            1)
              {
                echo
                echo "### 投稿する本文"
                echo
                cat "$RUNNER_TEMP/body.md"
              } >> "$GITHUB_STEP_SUMMARY"
              if [ "${DRY_RUN}" = "true" ]; then
                echo "::warning::dry_run のためコメントは投稿しない"
              else
                gh issue comment 56 --repo "${GITHUB_REPOSITORY}" --body-file "$RUNNER_TEMP/body.md"
              fi
              echo "::error::heartbeat が古い。issue #56 を確認してください"
              exit 1
              ;;
            3)
              # 抑止中でもジョブは失敗させ続ける。検知が続いている事実は Actions 上に残す
              echo "::error::heartbeat が古いが、直近に同じ検知を投稿済みのためコメントは出さない"
              exit 1
              ;;
            *)
              echo "::error::check_heartbeat_fresh.py が想定外の rc=$rc で終了した (watchdog 自身の故障)"
              exit 1
              ;;
          esac
