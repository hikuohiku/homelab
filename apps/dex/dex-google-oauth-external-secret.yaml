# Dex 用の envFrom Secret。Google OAuth の client_id/client_secret に加え、
# ArgoCD の staticClients エントリが使う client secret (T-0060) もここにまとめる。
# dex Deployment は envFrom でこの Secret を丸ごと環境変数として取り込む
# （apps/dex/values.yaml の envFrom 参照）ため、キーを増やすだけで新しい env var が生える。
# Requires: ClusterSecretStore 'doppler' to be ready
# Requires: Doppler secrets GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET,
#           DEX_ARGOCD_CLIENT_SECRET

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dex-google-oauth
  namespace: dex
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: dex-google-oauth
    creationPolicy: Owner
  data:
    - secretKey: GOOGLE_CLIENT_ID
      remoteRef:
        key: GOOGLE_OAUTH_CLIENT_ID
    - secretKey: GOOGLE_CLIENT_SECRET
      remoteRef:
        key: GOOGLE_OAUTH_CLIENT_SECRET
    - secretKey: DEX_ARGOCD_CLIENT_SECRET
      remoteRef:
        key: DEX_ARGOCD_CLIENT_SECRET
