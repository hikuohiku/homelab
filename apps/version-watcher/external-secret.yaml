# ops-health-reporter と同じ Doppler キー (GITHUB_HEALTH_REPORTER_TOKEN) を再利用する。
# watcher が使うのは main の ops/inventory.json を GET する読みだけ (書き込みは
# ConfigMap へ移った)。Doppler 側の token は共有なので write 権限を持ったままだが、
# この Pod からその権限を使う経路はもう無い。
# namespace が違うので Secret の実体はこちら側に複製される (名前は衝突しない)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-health-reporter-token
  namespace: version-watcher
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: github-health-reporter-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: GITHUB_HEALTH_REPORTER_TOKEN
