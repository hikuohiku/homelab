# ops-health-reporter と同じ Doppler キー (GITHUB_HEALTH_REPORTER_TOKEN) を再利用する。
# この token の権限は homelab リポジトリの Contents: Read and write のみで、watcher が
# latest.json を読み書きするのに十分かつ必要な範囲 (PROJECT.md 設計方針の既定)。
# namespace が違うので Secret の実体はこちら側に複製される (名前は衝突しない)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-health-reporter-token
  namespace: version-watcher
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: github-health-reporter-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: GITHUB_HEALTH_REPORTER_TOKEN
