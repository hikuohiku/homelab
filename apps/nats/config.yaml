# NATS JetStream の設定。イベント経路の実体 (設計 docs/design/event-driven-core D16)。
#
# 何を解いているか: これまで「人間が何か言った」を運ぶ経路が GitHub の ops-feedback
# ブランチだった。自宅クラスタの内部イベントが外部 SaaS を経由する構造で、GitHub が
# 落ちるかトークンが切れると所有者の「止めて」が heart に届かない。ここを閉じる。
#
# 秘密はこのファイルに書かない。載っている NKey は公開鍵で、秘密ではない。
# 対応する seed は Doppler に置き、クライアント側だけが持つ。
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: autopilot
data:
  nats.conf: |
    # cluster 内からのみ。Service も ClusterIP で、Ingress は作らない
    listen: 0.0.0.0:4222
    # /healthz と /varz を出す。liveness/readiness probe が使う
    http: 0.0.0.0:8222

    server_name: ops-bus

    jetstream {
      store_dir: /data/jetstream
      # 単一ノードなので実ディスクを予約しない local-path PVC に載る。
      # PVC の要求量 (5Gi) より小さく取って、PVC を食い潰す前に NATS 側で断る
      max_file_store: 3GB
      max_memory_store: 64MB
    }

    # 設計 D13: 誰がどの subject に触れるかをコードではなく設定で縛る。
    # producer は publish だけ、consumer は subscribe だけ。
    # 事故 (producer が consumer の subject を消す等) を権限で塞ぐ。
    #
    # 認証は NKey。ここに載っているのは**公開鍵**で、秘密ではない (Git に載せてよい)。
    # クライアントは seed (SU… で始まる秘密) で nonce に署名するだけで、
    # 秘密そのものはネットワークに出ない。パスワード方式だと NATS が
    # 「Plaintext passwords detected」と警告する状態になっていた (2026-08-23 実測) ため、
    # 誰も接続していないうちに NKey へ移した。seed は Doppler に置く。
    authorization {
      users: [
        {
          nkey: UANFJHMEHZNT7FJAL4T65T2UEIW6EEUN4HSMWSELNP6HJYYUW4YD6VD4
          permissions: {
            publish: { allow: ["events.>"] }
            subscribe: { allow: ["_INBOX.>"] }
          }
        },
        {
          nkey: UB2E2ROEPF2TMEOOCPEU32U4WRMZNNPOEI3EYM57ERGQOSQYPAH64KZO
          permissions: {
            # JetStream の consumer は $JS.API 経由で読む。pull consumer に必要な分だけ許す。
            # $JS.ACK.> は ack/nak/term の宛先で、$JS.API.> には含まれない。
            # これが無いと「メッセージは読めるが ack できない」= 同じイベントが
            # AckWait ごとに永久に再配送される状態になる (2026-08-23 に実測して気づいた)
            publish: { allow: ["$JS.API.>", "$JS.ACK.>", "_INBOX.>"] }
            subscribe: { allow: ["events.>", "_INBOX.>"] }
          }
        },
        {
          # 常駐コア専用 (core-driver と、その MCP 子プロセス)。
          # producer の鍵を使い回さないのは、事故のときに「誰が流したか」を
          # 権限で切り分けられるようにするため。コアが流せるのは判断済みの
          # command (events.heart.>) だけで、生イベント (events.raw.>) は読むだけ。
          # これで「コアが人間の書き置きを捏造する」経路が権限で塞がる
          nkey: UBFGH4FB27KAR2TKBNGORTJQWWH765NYASTVFY5KRSW3HLSGK3GGMZ7T
          permissions: {
            publish: { allow: ["events.heart.>", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"] }
            subscribe: { allow: ["events.raw.>", "_INBOX.>"] }
          }
        },
        {
          # ダッシュボードの書き置き投稿口 (/api/feedback) 専用。
          # telegram-adapter の producer 鍵を使い回さないのは、書き置きが
          # 「所有者の止めて」を運ぶ経路で、事故のときに出所を権限で切り分けたいため。
          # 流せるのは自分の subject 1 本だけで、他人のイベントは読めも消せもしない
          nkey: UDFD2VJSIAYJTDY7F7RDYMIIQJGX3SB4TUGYAHVM5OT7C6TGJVJBIYO2
          permissions: {
            # JetStream の publish は subject へ投げて _INBOX で ack を受けるだけ。
            # $JS.API.> は要らない (あれば stream を消せてしまう)
            publish: { allow: ["events.raw.homelab.dashboard"] }
            subscribe: { allow: ["_INBOX.>"] }
          }
        },
      ]
    }
