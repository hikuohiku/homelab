# NATS の認証情報を Doppler (homelab/prd) から取る。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
#
# 参照してよいキーは ops/rules.json の allowed_autopilot_doppler_keys で縛られ、
# ops/validate.py と ops/check_credential_map.py が CI で検査する。
#
# producer と consumer で鍵を分けているのは設計 D13 の要求 (誰がどの subject に
# 触れるかを設定で縛る)。producer 側の鍵が漏れても events を購読はできない。
#
# 配るのは NKey の seed (SU… で始まる秘密)。使うのは**クライアント側だけ**で、
# NATS サーバ自身は公開鍵しか持たない (nats.conf に直書きしてある)。
# seed は nonce への署名に使われ、秘密そのものはネットワークに出ない。
#
#   NATS_PRODUCER_NKEY_SEED — telegram-adapter / ops-dashboard が publish に使う
#   NATS_CONSUMER_NKEY_SEED — autopilot-core / heart が consume に使う
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats-credentials
  namespace: autopilot
spec:
  refreshInterval: 30m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: nats-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: NATS_PRODUCER_NKEY_SEED
      remoteRef:
        key: NATS_PRODUCER_NKEY_SEED
    - secretKey: NATS_CONSUMER_NKEY_SEED
      remoteRef:
        key: NATS_CONSUMER_NKEY_SEED
