# NATS の認証情報を Doppler (homelab/prd) から取る。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
#
# 参照してよいキーは ops/rules.json の allowed_autopilot_doppler_keys で縛られ、
# ops/validate.py と ops/check_credential_map.py が CI で検査する。
#
# producer と consumer で鍵を分けているのは設計 D13 の要求 (誰がどの subject に
# 触れるかを設定で縛る)。producer 側の鍵が漏れても events を購読はできない。
#
# 登録が必要な値 (どちらも `openssl rand -hex 32` 等のランダム文字列):
#   NATS_PRODUCER_PASSWORD — telegram-adapter / ops-dashboard が publish に使う
#   NATS_CONSUMER_PASSWORD — autopilot-core / heart が consume に使う
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nats-credentials
  namespace: autopilot
spec:
  refreshInterval: 30m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: nats-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: NATS_PRODUCER_PASSWORD
      remoteRef:
        key: NATS_PRODUCER_PASSWORD
    - secretKey: NATS_CONSUMER_PASSWORD
      remoteRef:
        key: NATS_CONSUMER_PASSWORD
