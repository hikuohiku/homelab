# ArgoCD が Dex を OIDC プロバイダーとして使うための client secret (T-0060)。
# 以前は apps/argocd/values.yaml の oidc.config.clientSecret にリテラル値を直書きしており、
# apps/dex/values.yaml の staticClients[0].secret と同じ値が平文で2箇所に重複していた。
#
# ArgoCD の oidc.config は `$<secret-name>:<key>` という参照構文を持つ（argoproj/argo-cd の
# util/settings/settings.go の oidcConfig()/ReplaceMapSecrets/getSecrets が実装）。
# この構文で解決される Secret は argocd-secret 本体である必要はないが、ArgoCD の secret informer
# から見えるために `app.kubernetes.io/part-of: argocd` ラベルが必須（付いていないと解決されない）。
#
# Requires: ClusterSecretStore 'doppler' to be ready
# Requires: Doppler secret DEX_ARGOCD_CLIENT_SECRET（apps/dex 側と同じ値を共有する）
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-dex-client-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: argocd-dex-client-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: secret
      remoteRef:
        key: DEX_ARGOCD_CLIENT_SECRET
