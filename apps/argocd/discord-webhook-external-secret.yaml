# ArgoCD Notifications → Discord incoming webhook (P-0139)。
# values.yaml の notifier (`service.webhook.discord`) は `$discord-webhook-url` で URL を参照する。
#
# 参照先 Secret 名が argocd-notifications-secret に固定されている理由: notifications-engine は
# `$<key>` 形の参照をこの 1 個の Secret からしか解決しない (controller 起動フラグ
# --secret-name の default。pkg/api/config.go の replaceStringSecret が対象は単一 Secret)。
# 別名の Secret + `$<secret-name>:<key>` という oidc.config 流の参照は notifications では使えない。
# chart 由来の空 Secret と名前が衝突するため、values.yaml 側で
# notifications.secret.create: false にして chart に作らせない (Secret の管理は ESO 一元)。
#
# Requires: ClusterSecretStore 'doppler' to be ready
# Requires: Doppler secret DISCORD_WEBHOOK_URL
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-notifications-discord-webhook
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: argocd-notifications-secret
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: discord-webhook-url
      remoteRef:
        key: DISCORD_WEBHOOK_URL
