# ArgoCD Helm Values
# https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd

# Enable Kustomize Helm Chart Inflation
configs:
  cm:
    kustomize.buildOptions: --enable-helm
    # ArgoCD URL
    url: https://argocd.tailae6c2.ts.net
    # 外部 Dex を OIDC プロバイダーとして使用
    # clientSecret は `$<secret-name>:<key>` 構文（T-0060）。参照先は
    # apps/argocd/dex-client-secret-external-secret.yaml が作る Secret
    oidc.config: |
      name: Dex
      issuer: https://dex.tailae6c2.ts.net
      clientID: argocd
      clientSecret: $argocd-dex-client-secret:secret
      requestedScopes:
        - openid
        - profile
        - email
    # ローカルアカウント (MCP read-only 用)
    accounts.agent: apiKey

  # RBAC 設定
  rbac:
    policy.csv: |
      g, hikuohiku@gmail.com, role:admin
      p, agent, applications, get, */*, allow
      p, agent, projects, get, *, allow
      p, agent, clusters, get, *, allow
    policy.default: ""
    scopes: "[email]"

  # Ingress 配下で TLS 終端されるため、内部は HTTP を使用
  params:
    server.insecure: true

# 組み込み Dex を無効化
dex:
  enabled: false


server:
  service:
    type: ClusterIP

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

controller:
  resources:
    # memory limits は付けない。2026-08-24 12:23 UTC、node01 復旧後の一斉 sync で
    # 512Mi の壁に当たって OOMKilled (exitCode 137) を 5 回繰り返し、
    # autopilot / immich の sync が完了せず heart が起動できなかった。
    # OOMKill は回復しないので、実測の裏付けなしに memory limits を置かない
    # (CHARTER §4)。CPU limits は throttle で回復するため据え置く
    limits:
      cpu: 500m
    requests:
      cpu: 250m
      memory: 256Mi

repoServer:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
