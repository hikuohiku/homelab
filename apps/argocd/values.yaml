# ArgoCD Helm Values
# https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd

# Enable Kustomize Helm Chart Inflation
configs:
  cm:
    kustomize.buildOptions: --enable-helm
    # ArgoCD URL
    url: https://argocd.tailae6c2.ts.net
    # 外部 Dex を OIDC プロバイダーとして使用
    # clientSecret は `$<secret-name>:<key>` 構文（T-0060）。参照先は
    # apps/argocd/dex-client-secret-external-secret.yaml が作る Secret
    oidc.config: |
      name: Dex
      issuer: https://dex.tailae6c2.ts.net
      clientID: argocd
      clientSecret: $argocd-dex-client-secret:secret
      requestedScopes:
        - openid
        - profile
        - email
    # ローカルアカウント (MCP read-only 用)
    accounts.agent: apiKey

  # RBAC 設定
  rbac:
    policy.csv: |
      g, hikuohiku@gmail.com, role:admin
      p, agent, applications, get, */*, allow
      p, agent, projects, get, *, allow
      p, agent, clusters, get, *, allow
    policy.default: ""
    scopes: "[email]"

  # Ingress 配下で TLS 終端されるため、内部は HTTP を使用
  params:
    server.insecure: true

# 組み込み Dex を無効化
dex:
  enabled: false


server:
  service:
    type: ClusterIP

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 64Mi

controller:
  # memory の根拠 (P-0181): origin/ops-health-report 履歴 867 サンプル
  # (2026-08-05..23, 30 分間隔) の実測系列より
  #   ピーク 398.0Mi @ 2026-08-23T04:30:08Z / p95 314.9Mi / 中央値 261.4Mi
  # 観測ピークはサンプリングの下限で、同日に旧 limit (0.5Gi) で OOMKill
  # 4 回 (exit_code 137) の実績があるため真のピークは 0.5Gi 以上と確定する。
  #   requests = p95 (314.9Mi) 切り上げの 320Mi
  #   limits = max(観測ピーク 398Mi, OOMKill 実績 0.5Gi) x 1.5 マージンの 768Mi
  # 成長率 +15.9Ki/day は有意でなく leak 疑いも無し。詳細は
  # ops/projects/logs/P-0181/memory-evidence.md
  resources:
    limits:
      cpu: 500m
      memory: 768Mi
    requests:
      cpu: 250m
      memory: 320Mi

repoServer:
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
