# restic + Backblaze B2 の共通 credential。syncthing/vaultwarden/immich/coder の
# CronJob と同じ Doppler キーを、adguard namespace の ExternalSecret から参照する
# （リポジトリパス末尾の "adguard" だけが restic-backup-cronjob.yaml 側でアプリ固有）。
# ClusterSecretStore はクラスタスコープなので、この namespace から新規登録なしにそのまま引ける。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
# Requires: Doppler secrets（既存共用。新規発行は不要）
#   RESTIC_PASSWORD — restic リポジトリの暗号化パスワード（復元時に必要）
#   RESTIC_B2_BUCKET — Backblaze B2 のバケット名
#   B2_ACCOUNT_ID    — B2 application key ID。削除権限を持つ鍵（append-only キーではない）。
#                      この Secret を使うのは **retention CronJob（forget --prune、削除権限が要る）
#                      だけ**。backup CronJob は下の adguard-restic-backup-credentials
#                      （append-only）を使う（T-0106 / P-0028 で確立した型）
#   B2_ACCOUNT_KEY   — 同上
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adguard-restic-credentials
  namespace: adguard
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: adguard-restic-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_B2_BUCKET
      remoteRef:
        key: RESTIC_B2_BUCKET
    - secretKey: B2_ACCOUNT_ID
      remoteRef:
        key: B2_ACCOUNT_ID
    - secretKey: B2_ACCOUNT_KEY
      remoteRef:
        key: B2_ACCOUNT_KEY
---
# backup 専用（削除権限を持たない append-only）credential。型は T-0106 / P-0028。
# B2_ACCOUNT_ID/B2_ACCOUNT_KEY だけ append-only の Doppler キーを参照する。
# Requires: Doppler secrets（既存共用）
#   B2_ACCOUNT_ID_APPEND_ONLY / B2_ACCOUNT_KEY_APPEND_ONLY
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adguard-restic-backup-credentials
  namespace: adguard
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: adguard-restic-backup-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_B2_BUCKET
      remoteRef:
        key: RESTIC_B2_BUCKET
    - secretKey: B2_ACCOUNT_ID
      remoteRef:
        key: B2_ACCOUNT_ID_APPEND_ONLY
    - secretKey: B2_ACCOUNT_KEY
      remoteRef:
        key: B2_ACCOUNT_KEY_APPEND_ONLY
