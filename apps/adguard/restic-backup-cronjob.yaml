# adguard-data PVC (conf/ = 人間が管理 UI で育てた設定本体、work/ = querylog/stats/
# filter キャッシュ) を restic で Backblaze B2 へバックアップする。型は syncthing
# (P-0047) と同型: backup は append-only 鍵、retention のみ削除鍵。
#
# 除外するものは無い (2026-08-23 時点の判断):
#   - AGH の work/ 配下は querylog.jsonl / stats.db / sessions.db / ダウンロード済み
#     フィルタで、どれも小さい (tailnet 1 家庭の現実量)。torn copy リスクのある
#     稼働中 DB を除外して再構築に頼るより、容量が小さいことを根拠に丸ごと取る
#     方が単純で、復元時の判断も要らない
#   - 本当に失いたくないのは conf/AdGuardHome.yaml (フィルタ選択・上流 DNS・
#     管理ユーザー)。これは必ず含まれる
# 初回実行時に restic init が走る (repository suffix "adguard" は新規)。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: adguard-restic-backup
  namespace: adguard
spec:
  # JST で評価される (node01 の time.timeZone)。既存 backup 帯
  # (2:45 immich / 3:10 coder / 3:30 workspace-home / 3:40 vaultwarden /
  #  3:55 syncthing) と重ならない 3:20 に置く
  schedule: "20 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 3600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: restic-backup
              image: restic/restic:0.19.1
              terminationMessagePolicy: FallbackToLogsOnError
              command:
                - sh
                - -c
                - |
                  set -eu
                  restic snapshots >/dev/null 2>&1 || restic init
                  restic backup /mnt/adguard-data
              # credential は backup 専用の append-only 鍵。削除権限つきの
              # adguard-restic-credentials は下の retention CronJob だけが使う
              env:
                - name: RESTIC_B2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: adguard-restic-backup-credentials
                      key: RESTIC_B2_BUCKET
                # bucket 名の後ろの "adguard" がリポジトリパスの区切り。
                # 既存は vaultwarden / immich / coder-postgres / coder-workspace-homes / syncthing
                - name: RESTIC_REPOSITORY
                  value: "b2:$(RESTIC_B2_BUCKET):adguard"
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: adguard-restic-backup-credentials
                      key: RESTIC_PASSWORD
                - name: B2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: adguard-restic-backup-credentials
                      key: B2_ACCOUNT_ID
                - name: B2_ACCOUNT_KEY
                  valueFrom:
                    secretKeyRef:
                      name: adguard-restic-backup-credentials
                      key: B2_ACCOUNT_KEY
              # AGH コンテナは root で動き conf/ を自分の権限で書くため、所有権を
              # 予測せずに読む必要がある。syncthing と同じ最小権限パターン:
              # 読み取り時の権限チェック回避のみ許可しフルの root 権限は持たせない。
              # 書き込みは readOnly: true でも構造的に禁止している
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                  add: ["DAC_READ_SEARCH"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                # memory limits は入れない（実測が無い。既存 5 アプリの backup CronJob と同型）
                limits:
                  cpu: 500m
              volumeMounts:
                - name: adguard-data
                  mountPath: /mnt/adguard-data/conf
                  subPath: conf
                  readOnly: true
                - name: adguard-data
                  mountPath: /mnt/adguard-data/work
                  subPath: work
                  readOnly: true
          volumes:
            - name: adguard-data
              persistentVolumeClaim:
                claimName: adguard-data
                readOnly: true
---
# 週次で古い世代を刈る (restic forget --prune)。PVC には触れないためマウント不要。
# 既存の retention 帯 (日曜 3:45 immich / 4:00 vaultwarden / 4:10 coder /
# 4:30 workspace-home / 4:50 syncthing) と重ならない 5:10 に置く
apiVersion: batch/v1
kind: CronJob
metadata:
  name: adguard-restic-retention
  namespace: adguard
spec:
  schedule: "10 5 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: restic-forget
              image: restic/restic:0.19.1
              terminationMessagePolicy: FallbackToLogsOnError
              command:
                - sh
                - -c
                - |
                  set -eu
                  restic snapshots >/dev/null 2>&1 || { echo "repository not initialized yet, skipping"; exit 0; }
                  restic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
              env:
                - name: RESTIC_B2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: adguard-restic-credentials
                      key: RESTIC_B2_BUCKET
                - name: RESTIC_REPOSITORY
                  value: "b2:$(RESTIC_B2_BUCKET):adguard"
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: adguard-restic-credentials
                      key: RESTIC_PASSWORD
                - name: B2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: adguard-restic-credentials
                      key: B2_ACCOUNT_ID
                - name: B2_ACCOUNT_KEY
                  valueFrom:
                    secretKeyRef:
                      name: adguard-restic-credentials
                      key: B2_ACCOUNT_KEY
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
