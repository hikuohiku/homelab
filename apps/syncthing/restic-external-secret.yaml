# restic + Backblaze B2 の共通credential。vaultwarden(T-0069)/immich(T-0068)/coder(T-0070) の
# CronJob と同じ Doppler キーを、syncthing namespace の ExternalSecret から参照する
# （リポジトリパス末尾の "syncthing" だけが restic-backup-cronjob.yaml 側でアプリ固有）。
# ClusterSecretStore はクラスタスコープなので、この namespace から新規登録なしにそのまま引ける。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
# Requires: Doppler secrets（T-0067 で人間が登録済み。新規発行は不要）
#   RESTIC_PASSWORD — restic リポジトリの暗号化パスワード（復元時に必要）
#   RESTIC_B2_BUCKET — Backblaze B2 のバケット名
#   B2_ACCOUNT_ID    — B2 application key ID。削除権限を持つ鍵（append-only キーではない）。
#                       この Secret を使うのは **retention CronJob（forget --prune、削除権限が要る）
#                       だけ**。backup CronJob は下の syncthing-restic-backup-credentials
#                       （append-only）を使う（T-0106 / P-0028 で確立した型）
#   B2_ACCOUNT_KEY   — 同上
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: syncthing-restic-credentials
  namespace: syncthing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: syncthing-restic-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_B2_BUCKET
      remoteRef:
        key: RESTIC_B2_BUCKET
    - secretKey: B2_ACCOUNT_ID
      remoteRef:
        key: B2_ACCOUNT_ID
    - secretKey: B2_ACCOUNT_KEY
      remoteRef:
        key: B2_ACCOUNT_KEY
---
# backup 専用（削除権限を持たない append-only）credential。retention CronJob
# （forget --prune、削除が必須）は引き続き上の syncthing-restic-credentials を使う。
# RESTIC_PASSWORD/RESTIC_B2_BUCKET はリポジトリの識別子であり秘匿すべき権限差が無いため
# 上と同じ Doppler キーを共用する。B2_ACCOUNT_ID/B2_ACCOUNT_KEY だけ append-only の
# Doppler キーを参照する。
# Requires: Doppler secrets（2026-08-07 に人間が登録済み。capabilities は 2026-08-10 に実測）
#   B2_ACCOUNT_ID_APPEND_ONLY  — B2 application key ID。
#                                 capabilities は listBuckets/listFiles/readFiles/writeFiles のみ
#                                 （deleteFiles を含めない）
#   B2_ACCOUNT_KEY_APPEND_ONLY — 同上 application key
#
# ⚠ この ExternalSecret は日次バックアップの単一障害点。syncthing-restic-backup CronJob は
#   この Secret だけを参照する。この ExternalSecret を消す、または Doppler の *_APPEND_ONLY
#   キーを消すと **日次バックアップが止まる**（同じことが immich / vaultwarden / coder の
#   同名 ExternalSecret にも当てはまる。合わせて 5 本の backup が依存）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: syncthing-restic-backup-credentials
  namespace: syncthing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: syncthing-restic-backup-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_B2_BUCKET
      remoteRef:
        key: RESTIC_B2_BUCKET
    - secretKey: B2_ACCOUNT_ID
      remoteRef:
        key: B2_ACCOUNT_ID_APPEND_ONLY
    - secretKey: B2_ACCOUNT_KEY
      remoteRef:
        key: B2_ACCOUNT_KEY_APPEND_ONLY
