apiVersion: v1
kind: Service
metadata:
  name: syncthing
  namespace: syncthing
  labels:
    app: syncthing
spec:
  # ClusterIP のみ。tailnet 経由の公開方式（sync ポート用の L3 ingress、GUI 公開要否）は T-0139 で決める
  type: ClusterIP
  selector:
    app: syncthing
  ports:
    - name: gui
      port: 8384
      targetPort: gui
    - name: sync-tcp
      port: 22000
      targetPort: sync-tcp
      protocol: TCP
    - name: sync-udp
      port: 22000
      targetPort: sync-udp
      protocol: UDP
    - name: discovery
      port: 21027
      targetPort: discovery
      protocol: UDP
