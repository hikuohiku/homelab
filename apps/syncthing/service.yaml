apiVersion: v1
kind: Service
metadata:
  name: syncthing
  namespace: syncthing
  labels:
    app: syncthing
spec:
  # GUI のみ。ingress.yaml (L7 Ingress) の backend として使う。
  # sync/discovery ポートは L7 Ingress で転送できないため service-tailnet.yaml (L3) に分離した（T-0139）
  type: ClusterIP
  selector:
    app: syncthing
  ports:
    - name: gui
      port: 8384
      targetPort: gui
