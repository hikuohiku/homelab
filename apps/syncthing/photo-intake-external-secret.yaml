# photo-intake CronJob が immich サーバへアップロードするための API キー (P-0085)。
# キーの発行は immich Web UI の User Settings > API Keys が公式手順で、エージェント側に
# 発行手段は無いため T-0049 型（manifest 先行・キー名決め打ちで依頼）で進める:
#   Doppler (homelab/prd) にキー名 IMMICH_API_KEY で「immich Web UI で発行した鍵の値」を
#   登録してほしい。登録されるまでこの ExternalSecret は同期できず、syncthing アプリは
#   Degraded を示す（T-0067 未完了時に immich/vaultwarden/coder がそうだったのと同じ形）。
#   登録後に ESO が自動同期し、CronJob が動き始める。
# 権限は upload に必要な最小限（Web UI 発行時に絞れるなら library 読み書き系のみ）を推奨。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: syncthing-photo-intake-credentials
  namespace: syncthing
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: syncthing-photo-intake-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: IMMICH_API_KEY
