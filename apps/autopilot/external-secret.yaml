# autopilot が動くために必要な 2 つの credential を Doppler (homelab/prd) から取る。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
# Requires: Doppler に以下のキーで値を登録すること（**まだ未登録**。credential の発行は
#           CHARTER §4「人間に渡してよいもの」に該当する。キー名はこちらで確定させたので、
#           人間側の作業は「この名前でこの値を入れる」だけで済む）
#   CLAUDE_CODE_OAUTH_TOKEN — Claude Code のヘッドレス実行用トークン
#                             （対話ログインができない Pod 内で `claude -p` を動かすため）
#   AUTOPILOT_GITHUB_TOKEN  — autopilot 自身の push / PR 作成用トークン。
#                             ops-health-reporter の GITHUB_HEALTH_REPORTER_TOKEN とは
#                             用途も必要権限も違うので共用しない（片方を失効させたときに
#                             もう片方を巻き込まないため）
#
# 値そのものはこのリポジトリには置かない（Git には ExternalSecret の参照だけが載る）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autopilot-credentials
  namespace: autopilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: autopilot-credentials
    creationPolicy: Owner
    # トークンを差し替える運用のときに ExternalSecret を消しても Secret が残るように
    # Retain（他アプリの ExternalSecret と揃える）
    deletionPolicy: Retain
  data:
    - secretKey: CLAUDE_CODE_OAUTH_TOKEN
      remoteRef:
        key: CLAUDE_CODE_OAUTH_TOKEN
    - secretKey: AUTOPILOT_GITHUB_TOKEN
      remoteRef:
        key: AUTOPILOT_GITHUB_TOKEN
