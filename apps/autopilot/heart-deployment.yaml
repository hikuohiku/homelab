# heart — heart-and-projects の決定論 reconcile ループ (ops/heart/)。
#
# **git には書かない** (設計 state-out-of-git 4b-2b)。プロジェクトの正は Project CR、
# 作業ファイルと doc の写しは PVC、生存は Lease。main は読むだけ。
#
# ラベルを app=autopilot にしないこと: ops-health-reporter (report.py) は
# app=autopilot の Pod のログから heartbeat を抽出しており、心拍が旧ループのものと
# して観測されると「旧ループが死んでいるのに healthy に見える」偽陰性を作る。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autopilot-heart
  namespace: autopilot
  labels:
    app: autopilot-heart
    # Mission Control (ops-dashboard) の「常駐」列挙用。
    # この label を付けた Deployment はエージェントライブに住人として載る
    heart/resident: "true"
spec:
  replicas: 1
  # heart は Project CR の単一書き手。旧 autopilot と同じ理由で常に高々 1 つ
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: autopilot-heart
  template:
    metadata:
      labels:
        app: autopilot-heart
      annotations:
        # pod の強制再作成用。K8s write 権限なしで再起動が要るときはこの値を更新して
        # Git → ArgoCD 経由で反映する (2026-08-22: 12 日常駐で fork 不能に陥った復旧)
        homelab.hikuohiku.dev/restart-stamp: "2026-08-22T06:50Z"
    spec:
      serviceAccountName: autopilot-heart
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: heart
          # 旧 autopilot Deployment と同じイメージ・同じ digest を使う。
          # AUTOPILOT_IMAGE (heart が runner Job を spawn するときのイメージ) も
          # 必ず同じ値にする — 2 箇所が同一ファイル内で隣接しているのは意図的
          image: ghcr.io/hikuohiku/homelab-autopilot@sha256:93a898cf0a1ec7a0363e9e2824f39670db2e3a8ca76674e755438ce8273c7bcb
          terminationMessagePolicy: FallbackToLogsOnError
          command: ["bash", "/config/heart-bootstrap.sh"]
          ports:
            # admission gate (設計 rev3 Phase D)。コアが dispatch_task で同期に
            # 着手を要求する口。cluster 内の autopilot-core からしか届かない
            # (heart-service.yaml の ClusterIP + NetworkPolicy)
            - name: gate
              containerPort: 8099
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          # 2026-08-12 の事故 (beat 3173 で fork 不能に陥り、以後 9 日以上
          # heartbeat.json が更新されないまま誰も気づけなかった) を受けて追加 (P-0065)。
          # beat() は run() 側の try/except で例外を握りつぶすため heart は死なずに
          # 回り続けるが、ops.heart.liveness.check() が heartbeat.json の鮮度で
          # 「詰まっている」を検知し、失敗したら kubelet に再起動させる。
          # しきい値 (STALE_MULTIPLIER / STALE_MARGIN_SECONDS) は ops/heart/liveness.py
          # の 1 箇所のみに定義され、このコマンドと単体テストの双方がそこを参照する。
          # initialDelaySeconds / periodSeconds / failureThreshold は repo clone +
          # 初回ビートの遅さと、正常時のネットワーク揺らぎを誤検知しない余裕を持たせた
          # 安全側の初期値で、実測の裏付けは無い (CHARTER §4)。
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - |
                  import sys
                  sys.path.insert(0, "/work/repo")
                  from ops.heart.liveness import main
                  main()
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          env:
            # Phase 2 (2026-08-08): shadow 並走の実績 (300 ビート無エラー・veto 疎通・
            # 判断ログの検分) を受けて active に切替。以後 heart は Job spawn / merge /
            # Discord 送信を実際に行う
            - name: HEART_MODE
              value: active
            # テンポ改善 (2026-08-09): 1 ビート 5 秒・LLM ゼロなので 60 秒に詰めても
            # コストはほぼ増えない。遷移ごとの待ちが半減する
            - name: HEART_BEAT_SECONDS
              value: "60"
            - name: AUTOPILOT_IMAGE
              value: ghcr.io/hikuohiku/homelab-autopilot@sha256:93a898cf0a1ec7a0363e9e2824f39670db2e3a8ca76674e755438ce8273c7bcb
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autopilot-credentials
                  key: CLAUDE_CODE_OAUTH_TOKEN
            - name: AUTOPILOT_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autopilot-credentials
                  key: AUTOPILOT_GITHUB_TOKEN
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: autopilot-credentials
                  key: DISCORD_WEBHOOK_URL
                  # Doppler 未登録でも heart 自体は起動できるように optional。
                  # 未設定なら notify が outbox に積み issue #56 へフォールバックする
                  optional: true
            - name: GIT_AUTHOR_NAME
              value: homelab-autopilot
            - name: GIT_AUTHOR_EMAIL
              value: autopilot@users.noreply.github.com
            - name: GIT_COMMITTER_NAME
              value: homelab-autopilot
            - name: GIT_COMMITTER_EMAIL
              value: autopilot@users.noreply.github.com
            - name: HOME
              value: /work/home
            - name: HEART_DATA_DIR
              value: /data
            # admission gate の listen (設計 rev3 Phase D)。空にすると gate を
            # 起こさない = コアの dispatch_task が isError になり、request_task
            # (バス経由の起票) だけの構成に切り戻る
            - name: HEART_GATE_LISTEN
              value: 0.0.0.0:8099
          resources:
            # memory limits は実測が無いうちは付けない (CHARTER §4)。
            # CPU の limits は付ける（throttle なので超過しても回復する）。
            # 2026-08-24 の node01 全停止時、このコンテナは 834m を使っていた
            # （4 コアのうち Job 3 本で 2927m、heart で 834m、計 3761m）。
            # limit 1 コアは実測ピークのすぐ上で、平常時は当たらない。
            # requests は据え置き（heart は常時ほぼアイドルで、834m はビート内の
            # git 操作と Job 観測が重なった瞬間値。ここを上げると常時予約が増えるだけ）
            requests:
              cpu: 50m
              memory: 256Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "1"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: work
              mountPath: /work
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp

        # --- バス経路の受け口 (設計 D16 の段階 3) ---
        #
        # 所有者の「止めて」が GitHub の可用性に依存している状態を解くための第 2 経路。
        # NATS の events.raw.> を durable pull consumer で読み、共有 PVC の
        # /data/feedback-bus/inbox/<id>.json に落とすだけ。判断は一切しない
        # (triage は heart の純関数のまま)。heart は既存の issue #56 /
        # ops-feedback ブランチと両読みし、同じ id は cursor が 1 回に落とす。
        #
        # このコンテナが死んでも heart は GitHub 経路で動き続ける。停止経路を運ぶ側が
        # 可用性を下げてはいけないので、liveness/readiness は持たせない
        - name: bus-sidecar
          # digest は merge commit c1e9de0 (PR #574) を build-heart-bus-image.yml が
          # ビルドした成果物の OCI index digest。registry API の
          # docker-content-digest で実測した値で、同時点の latest とも一致する。
          # bus-sidecar を直したら同じ手順で測り直して差し替えること
          image: ghcr.io/hikuohiku/homelab-heart-bus@sha256:1c00248d343243a3324c102f03a542e098e7bc7c01b49bbf48062b62818f5c17
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: NATS_URL
              value: nats://nats.autopilot.svc:4222
            # この 2 つを消せば GitHub 経路だけの構成に切り戻る (未設定なら
            # サイドカーは何もせず回り続ける)
            - name: NATS_NKEY_SEED
              valueFrom:
                secretKeyRef:
                  name: autopilot-credentials
                  key: NATS_CONSUMER_NKEY_SEED
            # core-driver とは別の durable。同じイベントを両者が独立に読む
            - name: NATS_DURABLE
              value: heart-feedback
            # heart 側の既定 (ops/heart/config.py の HEART_FEEDBACK_BUS_DIR) と
            # 同じ場所。ずれると「書いているのに読まれない」無言の故障になる
            - name: BUS_SIDECAR_OUT_DIR
              value: /data/feedback-bus/inbox
            # コア発の command (events.heart.>) の置き場。書き置きと**別**の
            # ディレクトリにするのは、混ぜると triage が人間の発話として誤分類し、
            # 依頼が briefing に埋もれるため。heart 側の既定
            # (ops/heart/config.py の HEART_COMMAND_BUS_DIR) と同じ場所
            - name: BUS_SIDECAR_COMMAND_DIR
              value: /data/command-bus/inbox
            - name: TZ
              value: Asia/Tokyo
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            # memory の limits は付けない (substrate の規則: 実測の裏付けなしに
            # 付けない。超過が回復不能な OOMKill になる)
            limits:
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            # 書く先は /data (共有 PVC) だけ
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: autopilot-config
        - name: work
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: autopilot-data
        - name: tmp
          emptyDir: {}
