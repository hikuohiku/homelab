# heart — heart-and-projects の決定論 reconcile ループ (ops/heart/)。
#
# Phase 1 は shadow モード (HEART_MODE=shadow): spawn / merge / Discord 送信をせず、
# 事実収集・信念照合・指標・ops-state 書き込みだけを実データで回して並走検証する。
# Phase 2 でこの Deployment を active に切り替え、旧 autopilot Deployment を退役させる。
#
# ラベルを app=autopilot にしないこと: ops-health-reporter (report.py) は
# app=autopilot の Pod のログから heartbeat を抽出しており、shadow の心拍が
# 旧ループの心拍として観測されると「旧ループが死んでいるのに healthy に見える」
# 偽陰性を作る。shadow の観測は ops-state ブランチの heartbeat.json 側で行う。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autopilot-heart
  namespace: autopilot
  labels:
    app: autopilot-heart
spec:
  replicas: 1
  # heart は ops-state ブランチの単一書き手。旧 autopilot と同じ理由で常に高々 1 つ
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: autopilot-heart
  template:
    metadata:
      labels:
        app: autopilot-heart
    spec:
      serviceAccountName: autopilot-heart
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: heart
          # 旧 autopilot Deployment と同じイメージ・同じ digest を使う。
          # AUTOPILOT_IMAGE (heart が runner Job を spawn するときのイメージ) も
          # 必ず同じ値にする — 2 箇所が同一ファイル内で隣接しているのは意図的
          image: ghcr.io/hikuohiku/homelab-autopilot@sha256:6d0cf8b13d602f189d75b48ef654cb0cfd0fe999740782928199097b7451bf75
          terminationMessagePolicy: FallbackToLogsOnError
          command: ["bash", "/config/heart-bootstrap.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          env:
            - name: HEART_MODE
              value: shadow
            - name: AUTOPILOT_IMAGE
              value: ghcr.io/hikuohiku/homelab-autopilot@sha256:6d0cf8b13d602f189d75b48ef654cb0cfd0fe999740782928199097b7451bf75
            - name: CLAUDE_CODE_OAUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autopilot-credentials
                  key: CLAUDE_CODE_OAUTH_TOKEN
            - name: AUTOPILOT_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autopilot-credentials
                  key: AUTOPILOT_GITHUB_TOKEN
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: autopilot-credentials
                  key: DISCORD_WEBHOOK_URL
                  # Doppler 未登録でも heart 自体は起動できるように optional。
                  # 未設定なら notify が outbox に積み issue #56 へフォールバックする
                  optional: true
            - name: GIT_AUTHOR_NAME
              value: homelab-autopilot
            - name: GIT_AUTHOR_EMAIL
              value: autopilot@users.noreply.github.com
            - name: GIT_COMMITTER_NAME
              value: homelab-autopilot
            - name: GIT_COMMITTER_EMAIL
              value: autopilot@users.noreply.github.com
            - name: HOME
              value: /work/home
            - name: HEART_DATA_DIR
              value: /data
          resources:
            # requests のみ。memory limits は実測が無いうちは付けない (CHARTER §4)
            requests:
              cpu: 50m
              memory: 256Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: work
              mountPath: /work
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: autopilot-config
        - name: work
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: autopilot-data
        - name: tmp
          emptyDir: {}
