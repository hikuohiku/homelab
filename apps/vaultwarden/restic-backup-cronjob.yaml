# vaultwarden データ (SQLite DB + attachments + rsa鍵 + config.json) を restic で
# Backblaze B2 へバックアップする (T-0069)。
#
# DB は稼働中の Pod に write されうるため、`/data` の PVC をそのまま restic に渡すと
# db.sqlite3-wal/-shm と本体の不整合を持ち込む (vaultwarden 公式 wiki が明記)。
# そのため initContainer で SQLite の Online Backup API (Python 標準ライブラリの
# sqlite3.Connection.backup()。CLI の `.backup`/vaultwarden 内蔵の VACUUM INTO と同じ
# 仕組みで稼働中でも一貫性のあるコピーが取れる) を使い、db.sqlite3 だけ emptyDir へ
# 一貫コピーしてから、本体の restic-backup コンテナが「PVC (db.sqlite3系とicon_cacheを除く) +
# 一貫コピー済みdb.sqlite3」の2パスをまとめて1スナップショットにする。
# python:3.14-alpine は標準ライブラリの sqlite3 モジュールを同梱しており、apk 等での
# パッケージ追加インストールが不要（ネットワーク先のパッケージリポジトリに依存しない）。
# 参考: https://github.com/dani-garcia/vaultwarden/wiki/Backing-up-your-vault
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-restic-sqlite-backup-script
  namespace: vaultwarden
data:
  sqlite_backup.py: |
    """SQLite Online Backup API (sqlite3.Connection.backup) で db.sqlite3 を一貫コピーする。

    読み取り専用でマウントした PVC 上の db.sqlite3 から、稼働中でも安全に
    (WAL/-shm との不整合を起こさずに) 別ディレクトリへ一貫性のあるコピーを作る。
    標準ライブラリの sqlite3 モジュールのみで動く。
    """

    import os
    import sqlite3

    SRC_DB = os.environ["SRC_DB"]
    DST_DB = os.environ["DST_DB"]


    def main():
        src = sqlite3.connect("file:{}?mode=ro".format(SRC_DB), uri=True)
        dst = sqlite3.connect(DST_DB)
        with dst:
            src.backup(dst)
        dst.close()
        src.close()
        print("backup complete: {} -> {}".format(SRC_DB, DST_DB))


    if __name__ == "__main__":
        main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-restic-backup
  namespace: vaultwarden
spec:
  schedule: "40 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # T-0097: 初回実行が restic backup 実行中に 1800s の deadline に到達し DeadlineExceeded で
      # 失敗した（sqlite の一貫コピー・restic リポジトリ作成までは成功していた）。同じ restic
      # backup CronJob である immich 側 (apps/immich/restic-backup-cronjob.yaml) が既に 3600s を
      # 使っており実績があるため、その値に揃える。根本原因（なぜ vaultwarden だけ時間がかかったか）
      # は未確定のまま、失敗を解消する方向の緩和として先に反映する（CHARTER §4、縛る変更のcooldownは
      # 失敗を緩める変更には適用しない）
      #
      # T-0108: DeadlineExceeded で restic のロックが残ったまま次回以降も失敗し続ける状態になって
      # いた（構築セッションが restic unlock --remove-all で解消した実例あり）。1回の失敗が
      # 恒久的な失敗にならないよう、backup 実行前に stale lock だけを外す restic unlock を先頭に入れる
      activeDeadlineSeconds: 3600
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          initContainers:
            - name: sqlite-snapshot
              image: python:3.14-alpine
              terminationMessagePolicy: FallbackToLogsOnError
              command: ["python", "/scripts/sqlite_backup.py"]
              env:
                - name: SRC_DB
                  value: /mnt/vaultwarden-data/db.sqlite3
                - name: DST_DB
                  value: /staging/db.sqlite3
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              # PVC は vaultwarden コンテナの fsGroup/runAsUser (1000) で書かれており、
              # このジョブは所有権に関わらず正しく読む必要があるため pvc-usage-cronjob.yaml
              # (T-0080) と同じ最小権限パターンを使う: 読み取り専用の権限チェック回避のみ許可し
              # フルの root 権限は持たせない。書き込みは readOnly: true でも構造的に禁止している
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                  add: ["DAC_READ_SEARCH"]
              # pvc-usage-cronjob.yaml (T-0080) と同じ資源クラス（標準ライブラリのみで軽量な
              # 読み取り処理）のため同じ値を流用。memory limit も既承認のこの値をそのまま使う
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
                - name: vaultwarden-data
                  mountPath: /mnt/vaultwarden-data
                  readOnly: true
                - name: staging
                  mountPath: /staging
          containers:
            - name: restic-backup
              image: restic/restic:0.19.1
              terminationMessagePolicy: FallbackToLogsOnError
              command:
                - sh
                - -c
                - |
                  set -eu
                  restic snapshots >/dev/null 2>&1 || restic init
                  restic unlock
                  restic backup /mnt/vaultwarden-data /staging/db.sqlite3 \
                    --exclude db.sqlite3 --exclude db.sqlite3-wal --exclude db.sqlite3-shm \
                    --exclude icon_cache
              env:
                - name: RESTIC_B2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-restic-credentials
                      key: RESTIC_B2_BUCKET
                # bucket 名の後ろの "vaultwarden" がリポジトリパスの区切り。immich/coder-postgres
                # は同じ bucket ・同じ credential で末尾だけ変えて使う想定 (T-0068/T-0070)
                - name: RESTIC_REPOSITORY
                  value: "b2:$(RESTIC_B2_BUCKET):vaultwarden"
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-restic-credentials
                      key: RESTIC_PASSWORD
                - name: B2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-restic-credentials
                      key: B2_ACCOUNT_ID
                - name: B2_ACCOUNT_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-restic-credentials
                      key: B2_ACCOUNT_KEY
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                  add: ["DAC_READ_SEARCH"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
              volumeMounts:
                - name: vaultwarden-data
                  mountPath: /mnt/vaultwarden-data
                  readOnly: true
                - name: staging
                  mountPath: /staging
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: vaultwarden-restic-sqlite-backup-script
            - name: vaultwarden-data
              persistentVolumeClaim:
                claimName: vaultwarden-data
                readOnly: true
            - name: staging
              emptyDir: {}
---
# 週次で古い世代を刈る (restic forget --prune)。PVC には触れないため readOnly マウント不要。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vaultwarden-restic-retention
  namespace: vaultwarden
spec:
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: restic-forget
              image: restic/restic:0.19.1
              terminationMessagePolicy: FallbackToLogsOnError
              command:
                - sh
                - -c
                - |
                  set -eu
                  restic snapshots >/dev/null 2>&1 || { echo "repository not initialized yet, skipping"; exit 0; }
                  restic forget --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
              env:
                - name: RESTIC_B2_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-restic-credentials
                      key: RESTIC_B2_BUCKET
                - name: RESTIC_REPOSITORY
                  value: "b2:$(RESTIC_B2_BUCKET):vaultwarden"
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-restic-credentials
                      key: RESTIC_PASSWORD
                - name: B2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-restic-credentials
                      key: B2_ACCOUNT_ID
                - name: B2_ACCOUNT_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vaultwarden-restic-credentials
                      key: B2_ACCOUNT_KEY
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
