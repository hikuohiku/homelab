# restic + Backblaze B2 の共通credential。immich(T-0068)/coder-postgres(T-0070)のCronJobでも
# 同じDopplerキーを各アプリのnamespaceのExternalSecretから参照する想定
# （リポジトリパス末尾の "vaultwarden" だけが restic-backup-cronjob.yaml 側でアプリ固有）。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
# Requires: Doppler secrets（T-0067, ops/backlog.json 参照。バケット作成・キー発行は人間の作業）
#   RESTIC_PASSWORD — restic リポジトリの暗号化パスワード（新規に決めて登録する。復元時に必要）
#   RESTIC_B2_BUCKET — Backblaze B2 のバケット名
#   B2_ACCOUNT_ID    — B2 application key ID。削除権限を持つ鍵（append-only キーではない）。
#                       この Secret を使うのは **retention CronJob（forget --prune、削除権限が要る）
#                       だけ**。node01 が乗っ取られるとこのキーでバックアップ自体を消せてしまう問題が
#                       T-0106 で指摘され、backup 専用の append-only キーを下の
#                       vaultwarden-restic-backup-credentials ExternalSecret に分離、
#                       P-0028 (T-0120) で backup CronJob の参照をそちらへ切り替え済み
#   B2_ACCOUNT_KEY   — 同上
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-restic-credentials
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: vaultwarden-restic-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_B2_BUCKET
      remoteRef:
        key: RESTIC_B2_BUCKET
    - secretKey: B2_ACCOUNT_ID
      remoteRef:
        key: B2_ACCOUNT_ID
    - secretKey: B2_ACCOUNT_KEY
      remoteRef:
        key: B2_ACCOUNT_KEY
---
# T-0106: backup 専用（削除権限を持たない append-only）credential。retention CronJob
# （forget --prune、削除が必須）は引き続き上の vaultwarden-restic-credentials を使う。
# RESTIC_PASSWORD/RESTIC_B2_BUCKET はリポジトリの識別子であり秘匿すべき権限差が無いため
# 上と同じ Doppler キーを共用する。B2_ACCOUNT_ID/B2_ACCOUNT_KEY だけ新しい Doppler キーを参照する。
# Requires: Doppler secrets（2026-08-07 に人間が登録済み。capabilities は 2026-08-10 に実測)
#   B2_ACCOUNT_ID_APPEND_ONLY  — B2 application key ID。
#                                 capabilities は listBuckets/listFiles/readFiles/writeFiles のみ
#                                 （deleteFiles を含めない）
#   B2_ACCOUNT_KEY_APPEND_ONLY — 同上 application key
#
# ⚠ この ExternalSecret は日次バックアップの単一障害点。P-0028 (T-0120) 以降、
#   vaultwarden-restic-backup CronJob はこの Secret だけを参照する。この ExternalSecret を消す、
#   または Doppler の *_APPEND_ONLY キーを消すと **日次バックアップが止まる**。
#   同じことが immich / coder の同名 ExternalSecret にも当てはまる（合わせて 4 本の backup が依存）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-restic-backup-credentials
  namespace: vaultwarden
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: vaultwarden-restic-backup-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_B2_BUCKET
      remoteRef:
        key: RESTIC_B2_BUCKET
    - secretKey: B2_ACCOUNT_ID
      remoteRef:
        key: B2_ACCOUNT_ID_APPEND_ONLY
    - secretKey: B2_ACCOUNT_KEY
      remoteRef:
        key: B2_ACCOUNT_KEY_APPEND_ONLY
