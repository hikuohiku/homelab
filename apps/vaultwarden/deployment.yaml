apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels:
    app: vaultwarden
spec:
  replicas: 1
  # SQLite は単一ファイル DB。RWO PVC を複数 Pod で同時マウントさせないよう
  # Recreate にして rolling 中の二重起動を防ぐ。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      securityContext:
        # /data の所有権を揃える。下の runAsUser と合わせる。
        fsGroup: 1000
      initContainers:
        # local-path の PVC は root:root で作成されるため、非 root 実行に備えて所有権を調整
        - name: init-permissions
          image: busybox:1.38.0
          terminationMessagePolicy: FallbackToLogsOnError
          command: ["sh", "-c", "chown -R 1000:1000 /data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: vaultwarden
          # latest ではなく具体的なバージョンに pin (最新安定版 1.37.1 / alpine variant)
          # 1.37.0 が Bitwarden クライアント 2026.7.0+ の対応に必須。
          # 1.37.1 は alpine イメージのビルド不具合 (OpenSSL) 修正を含むため alpine では 1.37.1 を採る。
          image: vaultwarden/server:1.37.1-alpine
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          env:
            # 公開 URL。/admin の origin 検証や WebAuthn/メール内リンクに使用
            - name: DOMAIN
              value: https://vaultwarden.tailae6c2.ts.net
            # 既存ユーザー移行のため新規サインアップは閉じる
            - name: SIGNUPS_ALLOWED
              value: "false"
            # vaultwarden は ROCKET_PORT のデフォルトが 80。明示しておく
            - name: ROCKET_PORT
              value: "80"
            # 1.37.0 で追加されたレート制限は remote peer の IP を見るが、Tailscale Ingress は
            # リバースプロキシとして自 Pod から backend へ接続するため、デフォルト設定では
            # 全クライアントが同一の proxy pod IP に見えてしまう (T-0032)。Tailscale 側は
            # X-Forwarded-For に実クライアントの tailnet peer アドレスを載せて送っているため、
            # IP_HEADER で明示的に読ませる
            - name: IP_HEADER
              value: "X-Forwarded-For"
            # IP_HEADER_TRUSTED_PROXIES の既定 "local" は private アドレス全体（10/8, 172.16/12,
            # 192.168/16 等）を信頼するため、クラスタ内部の別 namespace の Pod からでも
            # X-Forwarded-For を詐称できてしまう (T-0038)。この k3s クラスタの pod CIDR は
            # 10.42.0.0/16 固定（--cluster-cidr 未指定、デフォルト flannel。service CIDR が
            # 10.43.0.0/16 であることは ts-nameserver-fixed.yaml の clusterIP で確認済みで、
            # k3s のデフォルト組は pod=10.42.0.0/16 / service=10.43.0.0/16）。実際に信頼すべき
            # 送信元（tailscale-operator の Ingress proxy Pod）はこの範囲に収まるため、ここへ絞る
            - name: IP_HEADER_TRUSTED_PROXIES
              value: "10.42.0.0/16"
            # WebSocket 通知 (リアルタイム同期) は 1.x 系で HTTP ポートに統合済みのため
            # 別ポート/別 env (WEBSOCKET_ENABLED) は不要。Ingress も 80 だけで完結する。
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-admin-token
                  key: ADMIN_TOKEN
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /alive
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
