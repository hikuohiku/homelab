# T-0071: restic バックアップの復元試験（vaultwarden 分）。
#
# vaultwarden-restic-backup CronJob（apps/vaultwarden/restic-backup-cronjob.yaml）が B2 に
# 取っているスナップショットを、本番の vaultwarden-data PVC には一切触れずに使い捨ての別 PVC へ
# 実際に restic restore し、「データが読めること」を機械的に確認する一度きりの Job。
# immich 分（T-0071, 2026-08-05 完了、docs/backup.md 参照）と同じ設計で、判明済みの教訓を
# 初回実装から織り込んでいる:
#   - securityContext は capabilities.drop: ["ALL"] のまま、restore に必要な
#     CHOWN / FOWNER / DAC_OVERRIDE の3つを add する（所有者・パーミッション・
#     タイムスタンプの復元に要る。man 7 capabilities）
#   - restore 前に target を rm -rf でクリーンアップしてから実行する（PVC が
#     Job 再実行間で残り、前回 chown 済みの権限ビットが新たな失敗の原因になるのを防ぐ）
#   - restic restore の標準出力/標準エラー末尾も termination message に含める
#
# vaultwarden-restic-backup は2パスをまとめて1スナップショットにしている
# （apps/vaultwarden/restic-backup-cronjob.yaml 参照）:
#   - /mnt/vaultwarden-data （db.sqlite3系・icon_cache を除いた本体。rsa_key*.pem・
#     attachments/・config.json を含む）
#   - /staging/db.sqlite3 （SQLite Online Backup API で一貫コピーした DB 本体）
# restic は絶対パスのまま復元するため、restore 後は
# /mnt/restore/mnt/vaultwarden-data/... と /mnt/restore/staging/db.sqlite3 に分かれて現れる。
#
# 確認内容:
#   - restore 自体が exit 0 で終わること
#   - ファイルが1件以上復元されること
#   - rsa_key*.pem（JWT 署名鍵）が復元されていること（無いと復元後 vaultwarden が
#     全セッションを無効化した状態で起動することになる、docs/backup.md 参照）
#   - db.sqlite3 の先頭16バイトが SQLite のファイルフォーマットマジック
#     "SQLite format 3\0" と一致すること（破損したダンプでないことの最低限の確認）
#
# 結果の受け取り方は immich 分と同じ: autopilot の ClusterRole (autopilot-reader) には
# pods/log 権限が無いため、/dev/termination-log に判定用のサマリ行を書き、
# `kubectl get pod -n vaultwarden -l job-name=vaultwarden-restic-restore-verify -o json` の
# status.containerStatuses[].state.terminated.message から読む。
#
# 確認が取れ次第、この PVC/Job は削除する PR を出す（immich 分と同じ運用、
# vaultwarden-restic-backup 側の CronJob は変更しない）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-restore-verify
  namespace: vaultwarden
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vaultwarden-restic-restore-verify
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: restic-restore
          image: restic/restic:0.19.1
          command:
            - sh
            - -c
            - |
              set -u
              rm -rf /mnt/restore/* 2>/dev/null || true
              START=$(date +%s)
              RESTORE_OUTPUT=$(restic restore latest --target /mnt/restore 2>&1)
              RESTORE_RC=$?
              END=$(date +%s)
              ELAPSED=$((END - START))
              FILE_COUNT=$(find /mnt/restore -type f 2>/dev/null | wc -l | tr -d ' ')
              RSA_KEY_COUNT=$(find /mnt/restore -name 'rsa_key*.pem' 2>/dev/null | wc -l | tr -d ' ')
              DB=$(find /mnt/restore -path '*/staging/db.sqlite3' 2>/dev/null | sort | tail -1)
              DB_OK=false
              if [ -n "$DB" ]; then
                MAGIC=$(od -An -tx1 -N16 "$DB" 2>/dev/null | tr -d ' \n')
                [ "$MAGIC" = "53514c69746520666f726d6174203300" ] && DB_OK=true
              fi
              RESTORE_TAIL=$(echo "$RESTORE_OUTPUT" | tail -c 1500)
              MSG="restore_rc=$RESTORE_RC elapsed_seconds=$ELAPSED file_count=$FILE_COUNT rsa_key_count=$RSA_KEY_COUNT db=${DB:-none} db_sqlite_magic_ok=$DB_OK restore_output_tail=$RESTORE_TAIL"
              echo "$MSG"
              echo "$MSG" > /dev/termination-log
              if [ "$RESTORE_RC" -ne 0 ] || [ "$FILE_COUNT" -eq 0 ] || [ "$RSA_KEY_COUNT" -eq 0 ] || [ "$DB_OK" != "true" ]; then
                exit 1
              fi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          env:
            - name: RESTIC_B2_BUCKET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-restic-credentials
                  key: RESTIC_B2_BUCKET
            - name: RESTIC_REPOSITORY
              value: "b2:$(RESTIC_B2_BUCKET):vaultwarden"
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-restic-credentials
                  key: RESTIC_PASSWORD
            - name: B2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-restic-credentials
                  key: B2_ACCOUNT_ID
            - name: B2_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-restic-credentials
                  key: B2_ACCOUNT_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
          volumeMounts:
            - name: restore-target
              mountPath: /mnt/restore
      volumes:
        - name: restore-target
          persistentVolumeClaim:
            claimName: vaultwarden-restore-verify
