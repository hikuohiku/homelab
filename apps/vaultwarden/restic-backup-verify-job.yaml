# T-0104: 一度きりの検証用 Job。vaultwarden-restic-backup CronJob（次回実行 03:40 UTC、
# 明朝）を待たず、T-0103（remoteRef のキー名不一致修正）が実際に反映されて restic backup
# が成功するかを今すぐ確認するため、restic-backup-cronjob.yaml の jobTemplate と同じ内容を
# 一度だけ走らせる（issue #56, 2026-08-05 15:49:52 構築セッションの提案）。
#
# 確認が取れ次第、この Job は削除する PR を出す（restic-backup-cronjob.yaml 側は変更しない、
# CronJob の schedule は引き続き 03:40 UTC のまま）。
apiVersion: batch/v1
kind: Job
metadata:
  name: vaultwarden-restic-backup-verify
  namespace: vaultwarden
spec:
  backoffLimit: 1
  # T-0097: 初回実行が DeadlineExceeded で失敗したため、restic-backup-cronjob.yaml と同じ理由で
  # 3600s に揃える（immich 側の既存の実績値）
  activeDeadlineSeconds: 3600
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      initContainers:
        - name: sqlite-snapshot
          image: python:3.12-alpine
          command: ["python", "/scripts/sqlite_backup.py"]
          env:
            - name: SRC_DB
              value: /mnt/vaultwarden-data/db.sqlite3
            - name: DST_DB
              value: /staging/db.sqlite3
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: vaultwarden-data
              mountPath: /mnt/vaultwarden-data
              readOnly: true
            - name: staging
              mountPath: /staging
      containers:
        - name: restic-backup
          image: restic/restic:0.19.1
          command:
            - sh
            - -c
            - |
              set -eu
              restic snapshots >/dev/null 2>&1 || restic init
              restic backup /mnt/vaultwarden-data /staging/db.sqlite3 \
                --exclude db.sqlite3 --exclude db.sqlite3-wal --exclude db.sqlite3-shm \
                --exclude icon_cache
          env:
            - name: RESTIC_B2_BUCKET
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-restic-credentials
                  key: RESTIC_B2_BUCKET
            - name: RESTIC_REPOSITORY
              value: "b2:$(RESTIC_B2_BUCKET):vaultwarden"
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-restic-credentials
                  key: RESTIC_PASSWORD
            - name: B2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-restic-credentials
                  key: B2_ACCOUNT_ID
            - name: B2_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-restic-credentials
                  key: B2_ACCOUNT_KEY
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
          volumeMounts:
            - name: vaultwarden-data
              mountPath: /mnt/vaultwarden-data
              readOnly: true
            - name: staging
              mountPath: /staging
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: vaultwarden-restic-sqlite-backup-script
        - name: vaultwarden-data
          persistentVolumeClaim:
            claimName: vaultwarden-data
            readOnly: true
        - name: staging
          emptyDir: {}
