# restic + Backblaze B2 の共通 credential。immich/vaultwarden/coder/syncthing/adguard と
# **同じ Doppler キー**をこの namespace の ExternalSecret から参照する
# (リポジトリパス末尾の "autopilot-projects" だけが restic-backup-cronjob.yaml 側で固有)。
# ClusterSecretStore はクラスタスコープなので、新規登録なしにそのまま引ける。
# **新しい Doppler キーは要求しない**。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
# Requires: Doppler secrets（T-0067 で人間が登録済み。新規発行は不要）
#   RESTIC_PASSWORD  — restic リポジトリの暗号化パスワード（復元時に必要）
#   RESTIC_B2_BUCKET — Backblaze B2 のバケット名
#   B2_ACCOUNT_ID    — 削除権限を持つ application key。**retention CronJob だけ**が使う
#   B2_ACCOUNT_KEY   — 同上
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autopilot-projects-restic-credentials
  namespace: autopilot-projects-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: autopilot-projects-restic-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_B2_BUCKET
      remoteRef:
        key: RESTIC_B2_BUCKET
    - secretKey: B2_ACCOUNT_ID
      remoteRef:
        key: B2_ACCOUNT_ID
    - secretKey: B2_ACCOUNT_KEY
      remoteRef:
        key: B2_ACCOUNT_KEY
---
# backup 専用（削除権限を持たない append-only）credential。T-0106 / P-0028 で確立した型。
# RESTIC_PASSWORD/RESTIC_B2_BUCKET はリポジトリの識別子であり秘匿すべき権限差が無いため
# 上と同じ Doppler キーを共用し、B2_ACCOUNT_ID/B2_ACCOUNT_KEY だけ append-only の
# キーを参照する。この鍵で `restic init` / `unlock` / `backup` / `dump` はすべて通る
# (削除は b2_hide_file で行われ writeFiles で足りる。docs/backup.md の実測)。
#
# ⚠ この ExternalSecret を消すと Project CR の backup が止まる。Phase 4b 以降、
#   プロジェクトの記録はクラスタにしか無いので、止まったまま node01 を失うと全損する。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autopilot-projects-restic-backup-credentials
  namespace: autopilot-projects-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: autopilot-projects-restic-backup-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_B2_BUCKET
      remoteRef:
        key: RESTIC_B2_BUCKET
    - secretKey: B2_ACCOUNT_ID
      remoteRef:
        key: B2_ACCOUNT_ID_APPEND_ONLY
    - secretKey: B2_ACCOUNT_KEY
      remoteRef:
        key: B2_ACCOUNT_KEY_APPEND_ONLY
