# T-0104: 一度きりの検証用 Job。coder-restic-backup CronJob（次回実行 03:10 UTC、明朝）を
# 待たず、T-0103（remoteRef のキー名不一致修正）が実際に反映されて restic backup が成功するかを
# 今すぐ確認するため、restic-backup-cronjob.yaml の jobTemplate と同じ内容を一度だけ走らせる
# （issue #56, 2026-08-05 15:49:52 構築セッションの提案）。
#
# 確認が取れ次第、この Job は削除する PR を出す（restic-backup-cronjob.yaml 側は変更しない、
# CronJob の schedule は引き続き 03:10 UTC のまま）。
apiVersion: batch/v1
kind: Job
metadata:
  name: coder-restic-backup-verify
  namespace: coder
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      initContainers:
        - name: pg-dump
          image: postgres:17.10
          command:
            - sh
            - -c
            - |
              set -eu
              PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
                -h coder-postgres -U coder -d coder \
                -Fc -f /staging/coder-postgres.dump
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coder-postgres-credentials
                  key: password
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 300m
          volumeMounts:
            - name: staging
              mountPath: /staging
      containers:
        - name: restic-backup
          image: restic/restic:0.19.1
          command:
            - sh
            - -c
            - |
              set -eu
              restic snapshots >/dev/null 2>&1 || restic init
              restic backup /staging/coder-postgres.dump
          env:
            - name: RESTIC_B2_BUCKET
              valueFrom:
                secretKeyRef:
                  name: coder-restic-credentials
                  key: RESTIC_B2_BUCKET
            - name: RESTIC_REPOSITORY
              value: "b2:$(RESTIC_B2_BUCKET):coder-postgres"
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coder-restic-credentials
                  key: RESTIC_PASSWORD
            - name: B2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: coder-restic-credentials
                  key: B2_ACCOUNT_ID
            - name: B2_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: coder-restic-credentials
                  key: B2_ACCOUNT_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
          volumeMounts:
            - name: staging
              mountPath: /staging
              readOnly: true
      volumes:
        - name: staging
          emptyDir: {}
