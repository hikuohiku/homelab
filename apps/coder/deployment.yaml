apiVersion: apps/v1
kind: Deployment
metadata:
  name: coder
  namespace: coder
  labels:
    app: coder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coder
  template:
    metadata:
      labels:
        app: coder
    spec:
      serviceAccountName: coder
      # 終了時に workspace の後始末をする猶予を与える (chart 既定に合わせる)
      terminationGracePeriodSeconds: 60
      containers:
        - name: coder
          image: ghcr.io/coder/coder:v2.35.3
          terminationMessagePolicy: FallbackToLogsOnError
          command: ["/opt/coder"]
          args: ["server"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: CODER_HTTP_ADDRESS
              value: 0.0.0.0:8080
            # 公開 URL。ブラウザからのアクセス先で、workspace agent の接続先にもなる
            - name: CODER_ACCESS_URL
              value: https://coder.tailae6c2.ts.net
            # 既定で有効な GitHub OAuth プロバイダを切る (認証は後で dex 経由に寄せる)
            - name: CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE
              value: "false"
            - name: CODER_PG_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: coder-db-url
                  key: url
            # DERP 中継はレプリカ自身の Pod IP を広告する必要がある
            - name: KUBE_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CODER_DERP_SERVER_RELAY_URL
              value: http://$(KUBE_POD_IP):8080
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            # chart 既定は requests/limits とも 2000m/4096Mi だが、node01 は
            # 4c/11.7GiB で既に約 6GiB 使用済みのため単一ユーザー向けに絞る。
            # workspace は別 Pod として起動するのでここは制御プレーン分のみ。
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
