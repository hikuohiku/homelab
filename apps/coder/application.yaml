apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/hikuohiku/homelab.git
    targetRevision: HEAD
    path: apps/coder

  destination:
    server: https://kubernetes.default.svc
    namespace: coder

  # download-budget ConfigMap の report.json は download-ledger CronJob (P-0128) が
  # 毎時書き戻す B2 download cap の帳簿であり、Git (data: {}) と一致しないのが正。
  # このキーのみ差分比較から除外する ([ii] 生成フィールド型の恒久解消、P-0222)。
  # 帳簿データは無視するだけで消さない。他キー・他オブジェクトは対象外
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      name: download-budget
      jqPathExpressions:
        - '.data["report.json"]'

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
