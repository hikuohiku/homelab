# T-0117: coder workspace home backup (T-0078) の復元試験。
#
# coder-workspace-home-backup CronJob（apps/coder/workspace-home-backup-cronjob.yaml）が
# B2 リポジトリ b2:<bucket>:coder-workspace-homes へ workspace ごとに --host <workspace-id> で
# 取っているスナップショットのうち、workspace "test"（workspace_id:
# 7fdb7787-e2b7-4a6d-b54f-1640b5d9b587）分を、本番の coder-<id>-home PVC には一切触れずに
# 使い捨ての別 PVC へ実際に restic restore し、「データが読めること」を機械的に確認する
# 一度きりの Job。immich/vaultwarden/coder-postgres（T-0071, docs/backup.md）と同じ設計で、
# 判明済みの教訓を初回実装から織り込んでいる:
#   - securityContext は capabilities.drop: ["ALL"] のまま、restore に必要な
#     CHOWN / FOWNER / DAC_OVERRIDE の3つを add する（所有者・パーミッション・
#     タイムスタンプの復元に要る。man 7 capabilities）
#   - restore 前に target を rm -rf でクリーンアップしてから実行する
#   - restic restore の標準出力/標準エラー末尾も termination message に含める
#
# backup 側は home PVC を /staging に readOnly マウントして
# `restic backup /staging --host "$WORKSPACE_ID" ...` している
# （workspace-home-backup-cronjob.yaml 参照）ため、restic は絶対パスのまま復元し、
# 復元後は /mnt/restore/staging/... に現れる。1 リポジトリを複数 workspace で共有しているため
# `--host` を指定しないと最新書き込みの host（実行順序次第）が復元されてしまう点に注意。
#
# 確認内容:
#   - restore 自体が exit 0 で終わること
#   - ファイルが1件以上復元されること
#
# 結果の受け取り方: autopilot の ClusterRole (autopilot-reader) には pods/log 権限が無いため、
# /dev/termination-log に判定用のサマリ行を書き、
# `kubectl get pod -n coder -l job-name=coder-workspace-home-restic-restore-verify -o json` の
# status.containerStatuses[].state.terminated.message から読む。
#
# 確認が取れ次第、この PVC/Job は削除する PR を出す（immich/vaultwarden/coder-postgres 分と同じ運用）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: coder-workspace-home-restore-verify
  namespace: coder
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: coder-workspace-home-restic-restore-verify
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-options: Replace=true,Force=true
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
        - name: restic-restore
          image: restic/restic:0.19.1
          command:
            - sh
            - -c
            - |
              set -u
              rm -rf /mnt/restore/* 2>/dev/null || true
              START=$(date +%s)
              RESTORE_OUTPUT=$(restic restore latest --host "$WORKSPACE_ID" --target /mnt/restore 2>&1)
              RESTORE_RC=$?
              END=$(date +%s)
              ELAPSED=$((END - START))
              FILE_COUNT=$(find /mnt/restore -type f 2>/dev/null | wc -l | tr -d ' ')
              RESTORE_TAIL=$(echo "$RESTORE_OUTPUT" | tail -c 1500)
              MSG="restore_rc=$RESTORE_RC elapsed_seconds=$ELAPSED file_count=$FILE_COUNT restore_output_tail=$RESTORE_TAIL"
              echo "$MSG"
              echo "$MSG" > /dev/termination-log
              if [ "$RESTORE_RC" -ne 0 ] || [ "$FILE_COUNT" -eq 0 ]; then
                exit 1
              fi
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          env:
            - name: WORKSPACE_ID
              value: "7fdb7787-e2b7-4a6d-b54f-1640b5d9b587"
            - name: RESTIC_B2_BUCKET
              valueFrom:
                secretKeyRef:
                  name: coder-restic-credentials
                  key: RESTIC_B2_BUCKET
            - name: RESTIC_REPOSITORY
              value: "b2:$(RESTIC_B2_BUCKET):coder-workspace-homes"
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: coder-restic-credentials
                  key: RESTIC_PASSWORD
            - name: B2_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: coder-restic-credentials
                  key: B2_ACCOUNT_ID
            - name: B2_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: coder-restic-credentials
                  key: B2_ACCOUNT_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
          volumeMounts:
            - name: restore-target
              mountPath: /mnt/restore
      volumes:
        - name: restore-target
          persistentVolumeClaim:
            claimName: coder-workspace-home-restore-verify
