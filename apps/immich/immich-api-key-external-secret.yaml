# immich の管理 API キー (P-0361)。checksum CronJob (checksum-cronjob.yaml) が
# x-api-key で immich の管理 API (POST /api/jobs / GET /api/queues/... /
# GET /api/admin/integrity/summary) を叩くための admin API キー。
# Requires: Doppler secrets — IMMICH_API_KEY (immich の管理 UI で admin が API キーを
# 発行し、Doppler に登録する。人間の作業。未登録の間は ExternalSecret が
# SecretSyncedError になり checksum CronJob の Pod が起動しない — restic の B2 鍵と同型、
# apps/immich/restic-external-secret.yaml 参照)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-api-key
  namespace: immich
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: immich-api-key
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: IMMICH_API_KEY