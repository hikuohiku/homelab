controllers:
  main:
    containers:
      main:
        image:
          tag: v2.6.3
        env:
          DB_HOSTNAME: immich-postgres
          DB_USERNAME: immich
          DB_DATABASE_NAME: immich
          REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
          IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-postgres-credentials
                key: password
        # node01 は 4c/11.7GiB の単一ノード（T-0055）。API サーバー本体はリクエスト処理と
        # サムネイル/ジョブキュー消化が主で、他コンポーネント（coder 等）ほど重くない
        resources:
          requests:
            cpu: 150m
            memory: 256Mi
          # memory の limits は入れない。超えると throttle ではなく OOMKill になり、
          # 現に動いているサービスに「死ぬ条件」を与えることになる。実使用量を観測できる
          # ようになってから（T-0015 の後）検討する（issue #56, 2026-08-05）
          limits:
            cpu: 1500m

immich:
  persistence:
    library:
      existingClaim: immich-library

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.1.1-alpine
          # immich のジョブキュー/キャッシュ用途のみで、他コンポーネントよりずっと軽い（T-0055）
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
  persistence:
    data:
      enabled: true
      size: 1Gi
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      storageClass: local-path

server:
  enabled: true
  ingress:
    main:
      enabled: false

machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v2.6.3
          env:
            TRANSFORMERS_CACHE: /cache
            HF_XET_CACHE: /cache/huggingface-xet
            MPLCONFIGDIR: /cache/matplotlib-config
          # CLIP/顔認識モデルのロードでメモリが跳ねうるため、他コンポーネントより広めに確保
          # （T-0055）。requests は待機時の実測に近い最低保証、limits はモデルロード時の
          # バーストを許容しつつ他 Pod（vaultwarden/coder 含む）を巻き込まない上限
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 2000m
  persistence:
    cache:
      enabled: true
      size: 10Gi
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      storageClass: local-path
