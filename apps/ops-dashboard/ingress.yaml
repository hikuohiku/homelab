apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ops-dashboard
  namespace: autopilot
  annotations:
    tailscale.com/experimental-forward-cluster-traffic-via-ingress: "true"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: ops-dashboard
      port:
        number: 80
  tls:
    - hosts:
        # 置き換え要件: URL (tailnet ホスト名) は旧ダッシュボードから据え置く
        - ops-dashboard
