apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Mission Control (Next.js) — autopilot 監視ダッシュボード。
# PVC autopilot-data (transcripts) を読むため autopilot namespace に置く。
# アプリ本体は app/、イメージは .github/workflows/build-dashboard-image.yml が publish
resources:
  - rbac.yaml
  - external-secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # Mission Control 描画スモークの常設ジョブ (P-0193)
  - dashboard-smoke-cronjob.yaml

configMapGenerator:
  # 描画スモーク本体。canonical は ops/tools/dashboard_smoke.py (判定ロジックの
  # unittest がそこを import する) で、同ディレクトリ外を参照する相対パスは
  # kustomize の load 制限で使えないため同一内容のコピーを置いてある。
  # drift は ops/check_dashboard_smoke_script_sync.py (CI) が検出する —
  # 直すときは必ず両方を同じ PR で直すこと
  - name: dashboard-smoke-tool
    namespace: autopilot
    files:
      - dashboard_smoke.py

generatorOptions:
  # 名前にハッシュを付けない (autopilot / ops-health-reporter と同じ)。ハッシュが
  # 付くとスクリプト更新のたびに ConfigMap 名が変わり、CI の manifest-diff が
  # 「オブジェクトが消えた」と毎回判定して allow-delete の明記を要求する
  disableNameSuffixHash: true
