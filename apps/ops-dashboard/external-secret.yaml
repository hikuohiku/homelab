# ダッシュボードのフォームから ops-feedback ブランチへ書き置きを保存するためのトークン。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
#
# autopilot と同じ AUTOPILOT_GITHUB_TOKEN を使う（contents write を持つことは
# ops-health-report / ops-dashboard ブランチへの書き込みで実測済み）。別トークンを
# 起こさないのは、この経路が書くのが autopilot 専用ブランチの 1 ディレクトリだけで、
# autopilot が既に持っている権限を超えないため。main は ruleset が守っている。
# トークンはサーバプロセス（server.py）の中だけで使い、配信するページには出さない。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ops-dashboard-github-token
  namespace: ops-dashboard
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ops-dashboard-github-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: AUTOPILOT_GITHUB_TOKEN
