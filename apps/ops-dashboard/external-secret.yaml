# ダッシュボードのフォームから ops-feedback ブランチへ書き置きを保存するためのトークン。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
#
# autopilot と同じ AUTOPILOT_GITHUB_TOKEN を使う（contents write を持つことは
# ops-health-report / ops-dashboard ブランチへの書き込みで実測済み）。別トークンを
# 起こさないのは、この経路が書くのが autopilot 専用ブランチの 1 ディレクトリだけで、
# autopilot が既に持っている権限を超えないため。main は ruleset が守っている。
# トークンはサーバプロセス (Next.js の /api/feedback) の中だけで使い、配信するページには出さない。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ops-dashboard-github-token
  namespace: autopilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ops-dashboard-github-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: AUTOPILOT_GITHUB_TOKEN
---
# 書き置きを NATS へ publish するための NKey seed (設計 state-out-of-git Phase 6)。
#
# 別 Secret に分けるのは、GitHub トークンが消えても (Phase 7 でそうなる)
# バス経路が壊れないようにするため。
# 鍵は telegram-adapter の producer と分ける — 流せるのは
# events.raw.homelab.dashboard 1 本だけで、他人のイベントは読めも消せもしない
# (公開鍵と権限は apps/nats/config.yaml)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ops-dashboard-nats-credentials
  namespace: autopilot
spec:
  refreshInterval: 30m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ops-dashboard-nats-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: NATS_NKEY_SEED
      remoteRef:
        key: NATS_DASHBOARD_NKEY_SEED
