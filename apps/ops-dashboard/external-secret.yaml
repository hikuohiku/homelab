# 書き置きを NATS へ publish するための NKey seed (設計 state-out-of-git Phase 6)。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
#
# 以前はここに AUTOPILOT_GITHUB_TOKEN があった。ダッシュボードが書き置きを
# ops-feedback ブランチへ push していたときの名残で、GitHub への書き込みを
# やめたので不要になった。
#
# 鍵は telegram-adapter の producer と分ける — 流せるのは
# events.raw.homelab.dashboard 1 本だけで、他人のイベントは読めも消せもしない
# (公開鍵と権限は apps/nats/config.yaml)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ops-dashboard-nats-credentials
  namespace: autopilot
spec:
  refreshInterval: 30m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ops-dashboard-nats-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: NATS_NKEY_SEED
      remoteRef:
        key: NATS_DASHBOARD_NKEY_SEED
