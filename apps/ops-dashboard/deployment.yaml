apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-dashboard
  namespace: autopilot
  labels:
    app: ops-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ops-dashboard
  template:
    metadata:
      labels:
        app: ops-dashboard
      annotations:
        # NATS_NKEY_SEED は env 経由 (secretKeyRef) なので、ExternalSecret が
        # Secret を書き換えても走っている Pod には届かない。seed を差し替えたら
        # この値も更新して Pod を作り直す (apps/nats/deployment.yaml の
        # config-stamp と同じ役割)
        homelab.hikuohiku.dev/restart-stamp: "2026-08-25-nats-seed"
    spec:
      serviceAccountName: ops-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Mission Control (Next.js)。digest の更新手順は images/autopilot/Dockerfile
          # 冒頭コメントと同じ (build-dashboard-image.yml が push → 実測 → 反映)
          image: ghcr.io/hikuohiku/homelab-dashboard@sha256:956eb1688d0f8d176d794b4c24a9f26b03dfbfb461a7f1c580d271962ab9933e
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: AUTOPILOT_NAMESPACE
              value: autopilot
            - name: TRANSCRIPTS_DIR
              value: /data/transcripts
            # 書き置きの publish 先 (設計 state-out-of-git Phase 6)。
            # seed が無くても閲覧は動く (書き置きだけ 503 で issue #56 へ誘導)
            - name: NATS_URL
              value: nats://nats.autopilot.svc:4222
            - name: NATS_NKEY_SEED
              valueFrom:
                secretKeyRef:
                  name: ops-dashboard-nats-credentials
                  key: NATS_NKEY_SEED
                  optional: true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
          # memory limits は付けない: 実測の裏付けなしに縛らない (CHARTER §4)
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: autopilot-data
            readOnly: true
