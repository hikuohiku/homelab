apiVersion: apps/v1
kind: Deployment
metadata:
  name: ops-dashboard
  namespace: autopilot
  labels:
    app: ops-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ops-dashboard
  template:
    metadata:
      labels:
        app: ops-dashboard
    spec:
      serviceAccountName: ops-dashboard
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Mission Control (Next.js)。digest の更新手順は images/autopilot/Dockerfile
          # 冒頭コメントと同じ (build-dashboard-image.yml が push → 実測 → 反映)
          image: ghcr.io/hikuohiku/homelab-dashboard@sha256:98485f5816366b9a3e53c517f0a1b5637aa9f1be3b923f182b5853b03dae3ae4
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: AUTOPILOT_NAMESPACE
              value: autopilot
            - name: TRANSCRIPTS_DIR
              value: /data/transcripts
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ops-dashboard-github-token
                  key: token
                  # Secret が無くても閲覧は動かす (書き置きだけ 503 で issue #56 へ誘導)
                  optional: true
            # 書き置きの NATS 経路 (設計 state-out-of-git Phase 6)。
            # seed が無ければ publish を試みず GitHub 側だけで動く
            - name: NATS_URL
              value: nats://nats.autopilot.svc:4222
            - name: NATS_NKEY_SEED
              valueFrom:
                secretKeyRef:
                  name: ops-dashboard-nats-credentials
                  key: NATS_NKEY_SEED
                  optional: true
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
          # memory limits は付けない: 実測の裏付けなしに縛らない (CHARTER §4)
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: autopilot-data
            readOnly: true
