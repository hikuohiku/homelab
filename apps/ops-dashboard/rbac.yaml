# Mission Control の読み取り専用 SA。autopilot namespace の Job/Pod の観測と
# ログ取得だけを許す。書き込み動詞はゼロ (閲覧は read-only の設計決定)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-dashboard
  namespace: autopilot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-dashboard-read
  namespace: autopilot
rules:
  # heart の生死表示に Deployment の状態を読む (2026-08-22 実測: 無いと 403 で
  # snapshot の k8s 部分が丸ごと空になり、走行中エージェントが表示されない)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # CPU 飽和前兆 (P-9037) の warnings 表示。reporter が書く latest.json の
  # node_saturation キーを読む (dashboard は閲覧のみ。この ConfigMap 名に絞る)
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ops-health-report"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-dashboard-read
  namespace: autopilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-dashboard-read
subjects:
  - kind: ServiceAccount
    name: ops-dashboard
    namespace: autopilot
