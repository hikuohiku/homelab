# OpenClaw gateway が動くために必要な credential を Doppler (homelab/prd) から取る。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
#
# 参照してよいキーは ops/rules.json の allowed_autopilot_doppler_keys で縛られ、
# ops/validate.py (allowlist 方向) と ops/check_credential_map.py (双方向) が CI で検査する。
# 値そのものはこのリポジトリには置かない（Git には ExternalSecret の参照だけが載る）。
#
# 登録状況 (2026-08-22 時点):
#   OPENCODE_API_KEY         — 人間登録済み。OpenClaw built-in provider
#                              (`opencode-go/...` refs) が読む。autopilot-credentials の
#                              同名キーをここで再参照するのは、ops-dashboard-github-token
#                              と同じ自己完結方式（このアプリが消しても他アプリの Secret を
#                              壊さない / このアプリ単独で作り手を持つ）のため
#   TELEGRAM_BOT_TOKEN       — **未登録**。@BotFather 発行の bot トークン。OpenClaw は
#                              config へ書かず env fallback で読む (docs.openclaw.ai/channels/telegram)。
#                              登録されるまでこの ExternalSecret は Sync できず、Pod は
#                              CreateContainerConfigError で待機する（仕様どおりの状態）
#   TELEGRAM_ALLOWED_USER_ID — **未登録**。人間の Telegram 数値 user ID (getUpdates や
#                              @userinfobot で確認)。openclaw.json の allowFrom に
#                              ${TELEGRAM_ALLOWED_USER_ID} として展開される。未解決のままなら
#                              allowlist は誰にも一致しない = fail-closed
#   OPENCLAW_GATEWAY_TOKEN   — **未登録**。Gateway WS/HTTP control plane の認証トークン。
#                              auth required by default (docs.openclaw.ai/gateway/configuration)
#                              のため必須。値は `openssl rand -hex 32` 等のランダム文字列。
#                              spec 決定 (8) が列挙した 2 鍵に対する実装上の追加鍵だが、
#                              PROJECT.md 方針 6「ExternalSecret が参照する鍵名と rules.json
#                              を揃える」の原則に従い同じ PR で allowlist に足している
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-credentials
  namespace: autopilot
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: openclaw-credentials
    creationPolicy: Owner
    # トークンを差し替える運用のときに ExternalSecret を消しても Secret が残るように
    # Retain（他アプリの ExternalSecret と揃える）
    deletionPolicy: Retain
  data:
    - secretKey: OPENCODE_API_KEY
      remoteRef:
        key: OPENCODE_API_KEY
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_ALLOWED_USER_ID
      remoteRef:
        key: TELEGRAM_ALLOWED_USER_ID
    - secretKey: OPENCLAW_GATEWAY_TOKEN
      remoteRef:
        key: OPENCLAW_GATEWAY_TOKEN
