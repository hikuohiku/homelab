apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - external-secret.yaml
  - cronjob.yaml

configMapGenerator:
  - name: ops-health-reporter-script
    namespace: ops-health-reporter
    files:
      - report.py
      # report.py から `import download_budget` される (P-0128)。CronJob は
      # `python /scripts/report.py` で起動するため sys.path[0]=/scripts となり、
      # 追加マウント無しで解決する
      - download_budget.py
      # report.py から `import check_cert_expiry` される (P-0188)。正本は
      # ops/tools/check_cert_expiry.py で、これは手動同期コピー (version_watch.py
      # と同じ事情: configMapGenerator は kustomization.yaml の外のファイルを
      # 読めない)。同一性は ops.tests.test_cert_expiry が sha256 で機械検査する
      - check_cert_expiry.py

generatorOptions:
  disableNameSuffixHash: true
