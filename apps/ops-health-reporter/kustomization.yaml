apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - cronjob.yaml

configMapGenerator:
  - name: ops-health-reporter-script
    namespace: ops-health-reporter
    files:
      - report.py
      # report.py から `import download_budget` される (P-0128)。CronJob は
      # `python /scripts/report.py` で起動するため sys.path[0]=/scripts となり、
      # 追加マウント無しで解決する
      - download_budget.py
      # report.py から `import node_saturation` される (P-9037)。canonical は
      # ops/tools/node_saturation.py (drift は ops/check_node_saturation_script_sync.py)
      - node_saturation.py
      # report.py から `import root_disk_usage` される (P-9062)。canonical は
      # ops/tools/root_disk_usage.py (drift は ops/check_root_disk_usage_script_sync.py)
      - root_disk_usage.py

generatorOptions:
  disableNameSuffixHash: true
