apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - external-secret.yaml
  - cronjob.yaml

configMapGenerator:
  - name: ops-health-reporter-script
    namespace: ops-health-reporter
    files:
      - report.py
      # report.py から `import download_budget` される (P-0128)。CronJob は
      # `python /scripts/report.py` で起動するため sys.path[0]=/scripts となり、
      # 追加マウント無しで解決する
      - download_budget.py
      # 近接警報 (P-0181) の閾値。ops/rules.json の argocd_controller 節由来の同期コピー
      # (reporter は in-cluster で rules.json を直接読めないため)。drift は CI の
      # ops/check_argocd_alert_sync.py が検査する。片側だけ変えないこと
      - argocd-alerts.json

generatorOptions:
  disableNameSuffixHash: true
