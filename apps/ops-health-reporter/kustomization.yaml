apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - external-secret.yaml
  - cronjob.yaml

configMapGenerator:
  - name: ops-health-reporter-script
    namespace: ops-health-reporter
    files:
      - report.py
      # report.py から `import download_budget` される (P-0128)。CronJob は
      # `python /scripts/report.py` で起動するため sys.path[0]=/scripts となり、
      # 追加マウント無しで解決する
      - download_budget.py
      # 同様に `import recovery_probe` される (P-0258)。純関数のみの単一ファイルで、
      # cluster 外の unit test から importlib 直ロードできる (download_budget.py 流儀)
      - recovery_probe.py

generatorOptions:
  disableNameSuffixHash: true
