apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-health-reporter
  namespace: ops-health-reporter
---
# autopilot (クラウドサンドボックス) が読める場所に、クラスタの状態を書き戻すための
# 読み取り専用ロール。get/list のみで write 系動詞は一切含まない。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-health-reporter-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["pvc-usage-report"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-health-reporter-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ops-health-reporter-reader
subjects:
  - kind: ServiceAccount
    name: ops-health-reporter
    namespace: ops-health-reporter
---
# autopilot 自身のハートビート（iteration の開始/終了ログ）を読むための追加権限。
# pods/log は他 namespace のワークロード（vaultwarden/immich/coder 等）のログを
# 読む経路を一切新設したくないので、cluster-wide の ClusterRole ではなく
# autopilot namespace に閉じた Role にする（T-0110）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-health-reporter-autopilot-log-reader
  namespace: autopilot
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-health-reporter-autopilot-log-reader
  namespace: autopilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-health-reporter-autopilot-log-reader
subjects:
  - kind: ServiceAccount
    name: ops-health-reporter
    namespace: ops-health-reporter
