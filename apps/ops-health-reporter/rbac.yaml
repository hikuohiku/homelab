apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-health-reporter
  namespace: ops-health-reporter
---
# autopilot (クラウドサンドボックス) が読める場所に、クラスタの状態を書き戻すための
# 読み取り専用ロール。get/list のみで write 系動詞は一切含まない。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-health-reporter-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    # P-9062。kubelet stats/summary の `node.fs`（ルートディスク総量・imageFs・
    # pod volume 使用量）を読むための get のみ。**nodes/proxy の resourceNames は
    # node 名と照合される**（proxy サブパスとは照合されない）。`resourceNames:
    # ["stats/summary"]` にすると「stats/summary という名前の node」を指すことになり
    # node01 への要求は 403 で拒否される（実測済みの罠）。node01 だけに絞る
    # （他 node への proxy 経路＝pods 一覧・metrics・exec は開けない）
    resourceNames: ["node01"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes/stats"]
    # kubelet 側の Webhook 認可（apiserver 経由の proxy リクエストは kubelet が
    # /stats/* を nodes/stats サブリソースとして検査する）に応じる read-only の get。
    # kubelet の SubjectAccessReview は resourceName に node 名を入れてくるため
    # resourceNames で node01 に絞れる（proxy のサブパスとは違い、こちらは有効）
    resourceNames: ["node01"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    # download-budget (P-0128) は各 namespace の download-ledger CronJob が書く
    # B2 download cap の帳簿。pvc-usage-report への追加キーではなく専用名にした
    # (既存 pvc-usage-reporter が PUT で data 全体を置換するため、report.py の
    # DOWNLOAD_BUDGET_NAMESPACES コメント参照)。resourceNames の追加分だけ権限が増える
    # dashboard-smoke (P-0193) は autopilot ns の描画スモーク CronJob が書く
    # Mission Control 描画断言の記録 (report.py 参照)
    resourceNames: ["pvc-usage-report", "download-budget", "dashboard-smoke"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    # P-0175。ExternalSecret の status (SecretSyncedError 数・最終同期からの経過) を
    # 見るための読み取り。Secret 本体ではなく ExternalSecret CR のみで、
    # write 系 verb は含まない
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-health-reporter-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ops-health-reporter-reader
subjects:
  - kind: ServiceAccount
    name: ops-health-reporter
    namespace: ops-health-reporter
---
# autopilot 自身のハートビート（iteration の開始/終了ログ）を読むための追加権限。
# pods/log は他 namespace のワークロード（vaultwarden/immich/coder 等）のログを
# 読む経路を一切新設したくないので、cluster-wide の ClusterRole ではなく
# autopilot namespace に閉じた Role にする（T-0110）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-health-reporter-autopilot-log-reader
  namespace: autopilot
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-health-reporter-autopilot-log-reader
  namespace: autopilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-health-reporter-autopilot-log-reader
subjects:
  - kind: ServiceAccount
    name: ops-health-reporter
    namespace: ops-health-reporter
---
# 健全性レポートの書き先 (autopilot namespace の ConfigMap ops-health-report)。
# reporter は ops-health-reporter namespace に居るので、書き込みだけを autopilot 側へ
# 越境させる最小の Role を持つ。create は RBAC で名前を絞れないため対象名を含まない
# (dashboard-smoke / pvc-usage-reporter と同じ形)。update をこの 1 名に絞るのは、
# この namespace に heart へ流れ込む ConfigMap (autopilot-config = プロンプト類) が
# あるためで、無差別な update 許可はプロンプト注入経路になりうる。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-health-reporter-health-writer
  namespace: autopilot
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["ops-health-report"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-health-reporter-health-writer
  namespace: autopilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-health-reporter-health-writer
subjects:
  - kind: ServiceAccount
    name: ops-health-reporter
    namespace: ops-health-reporter
