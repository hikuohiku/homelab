apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-health-reporter
  namespace: ops-health-reporter
---
# autopilot (クラウドサンドボックス) が読める場所に、クラスタの状態を書き戻すための
# 読み取り専用ロール。get/list のみで write 系動詞は一切含まない。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ops-health-reporter-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    # download-budget (P-0128) は各 namespace の download-ledger CronJob が書く
    # B2 download cap の帳簿。pvc-usage-report への追加キーではなく専用名にした
    # (既存 pvc-usage-reporter が PUT で data 全体を置換するため、report.py の
    # DOWNLOAD_BUDGET_NAMESPACES コメント参照)。resourceNames の追加分だけ権限が増える
    resourceNames: ["pvc-usage-report", "download-budget"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list"]
# batch の get/list は backup 鮮度計 (P-0157) 用。「既存 reporter の拡張」を選んだ
# (DoD(1) の選定記録): 独立 CronJob (P-0128 型) は新 SA + 4 namespace 分の Role +
# latest.json への別 writer (P-0126 実測の衝突リトライ・壊れ JSON 復旧の負担) が必要で、
# 変更面積が大きい。reporter は既に 30 分毎にクラスタを読んで latest.json を上書きして
# いるので、観測の器に鮮度計を足すだけで閉じる。増える権限は読み取り専用の
# cronjobs/jobs get/list のみ (write 系 verb なし)。既存の pods/pvcs も cluster 全体を
# list しているため、権限の性質は既存と同水準
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ops-health-reporter-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ops-health-reporter-reader
subjects:
  - kind: ServiceAccount
    name: ops-health-reporter
    namespace: ops-health-reporter
---
# autopilot 自身のハートビート（iteration の開始/終了ログ）を読むための追加権限。
# pods/log は他 namespace のワークロード（vaultwarden/immich/coder 等）のログを
# 読む経路を一切新設したくないので、cluster-wide の ClusterRole ではなく
# autopilot namespace に閉じた Role にする（T-0110）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ops-health-reporter-autopilot-log-reader
  namespace: autopilot
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ops-health-reporter-autopilot-log-reader
  namespace: autopilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ops-health-reporter-autopilot-log-reader
subjects:
  - kind: ServiceAccount
    name: ops-health-reporter
    namespace: ops-health-reporter
