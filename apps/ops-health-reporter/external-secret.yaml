apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-health-reporter-token
  namespace: ops-health-reporter
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: github-health-reporter-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef:
        key: GITHUB_HEALTH_REPORTER_TOKEN
