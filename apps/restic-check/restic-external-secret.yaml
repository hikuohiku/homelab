# P-0102 — restic-check CronJob が使う credential。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
#
# なぜ 1 本で足りるか: 5 リポジトリ (vaultwarden / immich / coder-postgres /
# coder-workspace-homes / syncthing) は同一バケットのサブパスで、既存 4 namespace の
# backup 用 ExternalSecret はどれも同じ Doppler キー (RESTIC_PASSWORD / RESTIC_B2_BUCKET /
# B2_ACCOUNT_ID_APPEND_ONLY / B2_ACCOUNT_KEY_APPEND_ONLY) を参照している
# (docs/backup.md「append-only 鍵への切り替え」節。リポジトリの違いはパス末尾だけ)。
# そのため namespace 越え不可の制約への対処は「この namespace への複製 1 本」で足り、
# アプリ別に 4 本作るのは同じ値を持つ Secret の量産になるだけで分離の利点が無い。
# 参照するキーの権限は backup と同じ **append-only 鍵のみ**。削除鍵 (retention 用) は
# 持ち込まない — check は読み取りと lock 除去 (B2 では hide マーカー = writeFiles で通る)
# しかしないので、これ自体が「append-only 鍵で check が完走するか」の実検証対象になる
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-check-restic-credentials
  namespace: restic-check
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: restic-check-restic-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_B2_BUCKET
      remoteRef:
        key: RESTIC_B2_BUCKET
    # B2_ACCOUNT_ID/KEY のローカルキー名は既存 backup CronJob の env 名と揃える
    # (値は append-only 鍵を参照する。削除鍵の B2_ACCOUNT_ID/B2_ACCOUNT_KEY ではない)
    - secretKey: B2_ACCOUNT_ID
      remoteRef:
        key: B2_ACCOUNT_ID_APPEND_ONLY
    - secretKey: B2_ACCOUNT_KEY
      remoteRef:
        key: B2_ACCOUNT_KEY_APPEND_ONLY
---
# check 失敗・鮮度超過時の incident 通知先。heart (ops/heart/notify.py) と同じ Discord
# webhook の既存流路を使う (PROJECT.md 方針 4: 監視基盤の新規導入はしない)。成功時は黙る
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: restic-check-webhook
  namespace: restic-check
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: restic-check-webhook
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DISCORD_WEBHOOK_URL
      remoteRef:
        key: DISCORD_WEBHOOK_URL
