# bot が必要とする credential を Doppler (homelab/prd) から取る。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
#
# キー名は上流 (voicist/discord-dialouge-data-bot の .env.example) の環境変数名に揃える。
# 値そのものはこのリポジトリには置かない。Doppler への登録は人間の作業
#
# 参照するキー:
#   DISCORD_BOT_TOKEN — 録音用の専用 Bot のトークン。Message Content 等の特権 Intent は使わない
#   SONIOX_API_KEY    — 文字起こし (stt-async-v5)
#   GEMINI_API_KEY    — 議事録の要約
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: discord-dialogue-data-bot-credentials
  namespace: discord-dialogue-data-bot
spec:
  refreshInterval: 30m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: discord-dialogue-data-bot-credentials
    creationPolicy: Owner
    # トークンを差し替える運用のときに ExternalSecret を消しても Secret が残るように
    # Retain（他アプリの ExternalSecret と揃える）
    deletionPolicy: Retain
  data:
    - secretKey: DISCORD_BOT_TOKEN
      remoteRef:
        key: DISCORD_BOT_TOKEN
    - secretKey: SONIOX_API_KEY
      remoteRef:
        key: SONIOX_API_KEY
    - secretKey: GEMINI_API_KEY
      remoteRef:
        key: GEMINI_API_KEY
