# ghcr.io の private パッケージ (voicist/discord-dialouge-data-bot) を pull するための
# imagePullSecret。homelab 内の他アプリは public image なので、この形はここだけにある。
#
# GHCR_VOICIST_PULL_TOKEN は read:packages だけを持つ classic PAT。
# username は ghcr.io では検証されないが、docker config の形として要るので固定値を置く
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-voicist-pull
  namespace: discord-dialogue-data-bot
spec:
  refreshInterval: 30m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: ghcr-voicist-pull
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"ghcr.io":{"username":"voicist","password":"{{ .token }}","auth":"{{ printf "voicist:%s" .token | b64enc }}"}}}
  data:
    - secretKey: token
      remoteRef:
        key: GHCR_VOICIST_PULL_TOKEN
