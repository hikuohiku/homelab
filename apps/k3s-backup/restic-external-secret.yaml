# k3s データストアの backup / retention 用 credential。既存 6 本
# (vaultwarden / immich / coder / coder-workspace-homes / syncthing / adguard) と
# 同じ Doppler キーをそのまま参照するので、**Doppler への新規登録は不要**。
# ClusterSecretStore 'doppler' はクラスタスコープなのでこの namespace からも引ける。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
#
# 削除権限つき (retention 専用)。node01 が乗っ取られたときにバックアップ自体を消せる鍵なので、
# 日次 backup CronJob には渡さない (T-0106 / P-0028 の分離をそのまま踏襲)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k3s-backup-restic-credentials
  namespace: k3s-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: k3s-backup-restic-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_B2_BUCKET
      remoteRef:
        key: RESTIC_B2_BUCKET
    - secretKey: B2_ACCOUNT_ID
      remoteRef:
        key: B2_ACCOUNT_ID
    - secretKey: B2_ACCOUNT_KEY
      remoteRef:
        key: B2_ACCOUNT_KEY
---
# backup 専用 (append-only。deleteFiles を持たない B2 application key)。
# RESTIC_PASSWORD / RESTIC_B2_BUCKET はリポジトリの識別子で権限差が無いため上と共用する。
#
# ⚠ この ExternalSecret を消す、または Doppler の *_APPEND_ONLY キーを消すと
#   k3s データストアの日次バックアップが止まる (既存 4 本の backup も同じキーに依存)。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: k3s-backup-restic-backup-credentials
  namespace: k3s-backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: k3s-backup-restic-backup-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: RESTIC_PASSWORD
      remoteRef:
        key: RESTIC_PASSWORD
    - secretKey: RESTIC_B2_BUCKET
      remoteRef:
        key: RESTIC_B2_BUCKET
    - secretKey: B2_ACCOUNT_ID
      remoteRef:
        key: B2_ACCOUNT_ID_APPEND_ONLY
    - secretKey: B2_ACCOUNT_KEY
      remoteRef:
        key: B2_ACCOUNT_KEY_APPEND_ONLY
