# コア専用の ServiceAccount。
#
# **何の権限も無い。** RoleBinding を付けないのが仕様で、コアは K8s API を触らない
# (設計 D3: 変更は heart 経由)。Deployment 側で automountServiceAccountToken: false に
# しているのでトークンも配られない。
#
# 既定 (未指定) だと default SA のトークンが自動マウントされる。コアに bash を
# 開けたとき、それは「秘密を env から消したのに /var/run/secrets には残っている」
# という穴になる。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autopilot-core
  namespace: autopilot
automountServiceAccountToken: false
