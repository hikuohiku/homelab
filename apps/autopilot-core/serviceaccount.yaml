# コア専用の ServiceAccount。
#
# **read だけ。** ClusterRole `autopilot-reader` に bind してある (rbac.yaml)。
# get/list のみで書き込み動詞は無く、Secret も含まれない。クラスタへの変更は
# 従来どおり heart 経由 (設計 D3/D7)。
#
# **automountServiceAccountToken: false は外さないこと。** トークンは Deployment の
# projected volume で core-driver-mcp コンテナにだけ渡している。automount を戻すと
# 全コンテナに配られ、bash を開けたコアが /var/run/secrets/... から直接 API server を
# 叩けるようになる — MCP ツールという固定された窓の意味が消える。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: autopilot-core
  namespace: autopilot
automountServiceAccountToken: false
