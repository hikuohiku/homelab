# 常駐コアが必要とする credential を Doppler (homelab/prd) から取る。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
#
# 参照してよいキーは ops/rules.json の allowed_autopilot_doppler_keys で縛られ、
# ops/validate.py と ops/check_credential_map.py が CI で検査する。
#
#   OPENCODE_API_KEY         — opencode go 定額の認証。コアの思考エンジン
#   TELEGRAM_BOT_TOKEN       — MCP 返信ツールが sendMessage に使う (子プロセスが env を継承)
#   TELEGRAM_ALLOWED_USER_ID — 返信の宛先。未設定なら MCP サーバが起動に失敗する (fail-closed)
#   AUTOPILOT_GITHUB_TOKEN   — driver が ops-feedback の inbox を読むために使う
#   NATS_CONSUMER_NKEY_SEED  — driver がイベント経路 (設計 D16) から読むための鍵。
#                              subscribe 専用の権限で、この鍵では events へ publish できない。
#                              nats アプリの Secret を参照せず自前で持つのは、
#                              あちらが消えてもこちらが壊れないため (telegram-adapter と同じ)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autopilot-core-credentials
  namespace: autopilot
spec:
  refreshInterval: 30m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: autopilot-core-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OPENCODE_API_KEY
      remoteRef:
        key: OPENCODE_API_KEY
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_ALLOWED_USER_ID
      remoteRef:
        key: TELEGRAM_ALLOWED_USER_ID
    - secretKey: AUTOPILOT_GITHUB_TOKEN
      remoteRef:
        key: AUTOPILOT_GITHUB_TOKEN
    - secretKey: NATS_CONSUMER_NKEY_SEED
      remoteRef:
        key: NATS_CONSUMER_NKEY_SEED
