# autopilot-core — 常駐する opencode セッションと、そこへイベントを渡す driver。
#
# コアは「見て答える」ところまでを持つ。実装・merge・Job の起動はしない
# (heart の担当のまま)。opencode の permission で edit を拒否し、bash は main の
# 履歴を読む git だけに絞ってあるので、器のレベルで着手できない (config.yaml)。
#
# 目は 3 つある:
#   (1) ops-dashboard / ops-health-report — 既存の 2 ツール
#   (2) k8s API の read (live)            — core-driver-mcp サイドカーだけがトークンを持つ
#   (3) main の作業コピー /data/repo      — driver が保ち、opencode には read-only で渡す
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autopilot-core
  namespace: autopilot
  labels:
    app: autopilot-core
    # Mission Control (ops-dashboard) の「常駐」列挙用。
    # 次の住人を増やすときもこの label を metadata.labels に付けるだけでよい
    heart/resident: "true"
spec:
  replicas: 1
  # セッション storage を単一 PVC に持つので、rolling 中の二重起動を避ける
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: autopilot-core
  template:
    metadata:
      labels:
        app: autopilot-core
      annotations:
        # pod の強制再作成用 (heart と同型。K8s write 権限なしで再起動したいとき)
        homelab.hikuohiku.dev/restart-stamp: "2026-08-24T17:12Z"
    spec:
      terminationGracePeriodSeconds: 30
      # 専用 SA。read 専用の ClusterRole `autopilot-reader` に bind してある
      # (rbac.yaml)。**automountServiceAccountToken は false のまま**にすること。
      # true に戻すと全コンテナにトークンが配られ、bash を開けたコアが
      # /var/run/secrets/... から API server を叩けてしまう。
      # トークンは下の kube-api-access (projected) を core-driver-mcp にだけ
      # volumeMounts する形で渡している — volumeMounts はコンテナ単位なので、
      # opencode コンテナからは見えないまま k8s API へ到達できる
      serviceAccountName: autopilot-core
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # 以下すべての core イメージ digest は必ず同じ値にする。
        # ops/check_version_sync.py の "autopilot-core image digest" が一致を検査する。
        # c1e9de0076ec67089b20f6b0e0e242d7987225a6 (PR #574 = コアが request_task で dispatch) の
        # OCI index digest を registry API の docker-content-digest で実測したもの
        #
        # **この digest は MCP サイドカーの `--listen` をまだ知らない。** イメージは
        # main への push でしか焼かれないため、マージ → ビルド完了 → digest を実測して
        # ここを pin し直す、の順で入れること。pin し直すまでサイドカーは起動できず、
        # コアは生きているがツールを持たない状態になる (この注記も pin 時に消す)
        #
        # ConfigMap は read-only mount なので、opencode が書ける場所へ配置し直す
        # PVC 上の home/ と repo/ をここで作るのは、opencode コンテナがそれらを
        # subPath で mount するため。subPath のディレクトリが無いと kubelet が
        # root 所有で作ってしまい、10001 で走る driver が作業コピーを書けなくなる
        - name: bootstrap-workdir
          image: ghcr.io/hikuohiku/homelab-autopilot-core@sha256:f9afede153954fd94cfe2bd55907628ee1219120e72bf675b10b4d3f3d8e2d34
          command:
            - sh
            - -c
            - cp /config/opencode.json /config/AGENTS.md /work/ && mkdir -p /data/home /data/repo
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: work
              mountPath: /work
            - name: state
              mountPath: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        # --- コア本体 ---
        - name: opencode
          # heart と同じ autopilot イメージ (opencode-ai が入っている)。
          # digest は ops/check_version_sync.py の "autopilot image digest" が
          # heart / 旧 loop と一致することを検査する
          image: ghcr.io/hikuohiku/homelab-autopilot@sha256:93a898cf0a1ec7a0363e9e2824f39670db2e3a8ca76674e755438ce8273c7bcb
          terminationMessagePolicy: FallbackToLogsOnError
          # cluster 外にも他 Pod にも出さない。driver は同じ Pod の localhost から話す
          command: ["sh", "-c", "cd /work && exec opencode serve --hostname 127.0.0.1 --port 4096"]
          # **このコンテナに長期の秘密を置かない。**
          # コアは Telegram・GitHub・web という信頼できない入力を読む。bash を開けると
          # `cat /proc/self/environ` で env の中身が全部読めるので、秘密と外部送信経路が
          # 同じプロセスに揃ってしまう。コマンドの制限では守れない — 秘密をこのプロセスから
          # 物理的に無くすのが唯一の防御。Telegram / GitHub / NATS の credential は
          # 下の MCP サイドカーの env にだけ置いてある。
          #
          # OPENCODE_API_KEY だけは残さざるを得ない (opencode 本体が推論に使う)。
          # これは「コアが自分の頭を使う鍵」であって、他人になりすませる鍵ではない
          env:
            - name: HOME
              value: /data/home
            - name: OPENCODE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: autopilot-core-credentials
                  key: OPENCODE_API_KEY
            - name: TZ
              value: Asia/Tokyo
          # PVC は subPath で 2 つだけ見せる。丸ごと mount しないのは、driver の
          # cursor (既読の台帳) をコアが書き換えられる状態にしないため。
          # repo は readOnly — 設計 D30「コアは git に書かない」を allowlist ではなく
          # マウントの性質として持たせる (push 用の credential もこのコンテナには無い)
          volumeMounts:
            - name: work
              mountPath: /work
            - name: state
              mountPath: /data/home
              subPath: home
            - name: state
              mountPath: /data/repo
              subPath: repo
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            # memory の limits は付けない（substrate の規則: 実測の裏付けなしに付けない。
            # 超過が回復不能な OOMKill になる。CPU limits は throttle で回復するため設定する）
            limits:
              cpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

        # --- コアの声 (MCP サイドカー) ---
        #
        # opencode は remote MCP として 127.0.0.1:4097 に繋ぐ (config.yaml)。
        # 同一 Pod の loopback はネットワーク名前空間が境界なので認証は要らない。
        # opencode.json の headers にトークンを置くのは**逆効果**で、GET /config が
        # {env:...} 展開後の値をそのまま返すためコアから丸見えになる。
        - name: telegram-adapter
          image: ghcr.io/hikuohiku/homelab-autopilot-core@sha256:f9afede153954fd94cfe2bd55907628ee1219120e72bf675b10b4d3f3d8e2d34
          terminationMessagePolicy: FallbackToLogsOnError
          command: ["/usr/local/bin/telegram-adapter", "mcp", "--listen", "127.0.0.1:4097"]
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autopilot-core-credentials
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_ALLOWED_USER_ID
              valueFrom:
                secretKeyRef:
                  name: autopilot-core-credentials
                  key: TELEGRAM_ALLOWED_USER_ID
            - name: TZ
              value: Asia/Tokyo
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

        # --- コアの目と手 (MCP サイドカー) ---
        #
        # homelab_status / homelab_health / homelab_applications / homelab_pods /
        # homelab_events / request_task。GitHub トークンと NATS の seed はここにだけ置く。
        # この 2 つを消せば request_task が「経路が無い」と返り、読み取りツールは動き続ける。
        #
        # k8s API のトークン (kube-api-access) も**このコンテナにだけ** mount する。
        # 権限は ClusterRole `autopilot-reader` の get/list だけで、Secret も
        # 書き込み動詞も含まれない (rbac.yaml)
        - name: core-driver-mcp
          image: ghcr.io/hikuohiku/homelab-autopilot-core@sha256:f9afede153954fd94cfe2bd55907628ee1219120e72bf675b10b4d3f3d8e2d34
          terminationMessagePolicy: FallbackToLogsOnError
          command: ["/usr/local/bin/core-driver", "mcp", "--listen", "127.0.0.1:4098"]
          volumeMounts:
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          env:
            - name: AUTOPILOT_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autopilot-core-credentials
                  key: AUTOPILOT_GITHUB_TOKEN
            - name: NATS_URL
              value: nats://nats.autopilot.svc:4222
            - name: NATS_NKEY_SEED
              valueFrom:
                secretKeyRef:
                  name: autopilot-core-credentials
                  key: NATS_CORE_NKEY_SEED
            # heart の admission gate (設計 rev3 Phase D)。dispatch_task の宛先。
            # cluster 内の ClusterIP だけで、認証は持たない (持たせると
            # ops/rules.json の Doppler 鍵 allowlist を触ることになる)。
            # 送信元はこの Pod に限られる (apps/autopilot/heart-service.yaml の
            # NetworkPolicy)。ここを空にすると dispatch_task が届かず isError に
            # なり、コアは request_task の経路に案内する
            - name: CORE_HEART_GATE_URL
              value: http://autopilot-heart.autopilot.svc:8099
            - name: TZ
              value: Asia/Tokyo
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

        # --- イベントを渡す係 ---
        - name: driver
          image: ghcr.io/hikuohiku/homelab-autopilot-core@sha256:f9afede153954fd94cfe2bd55907628ee1219120e72bf675b10b4d3f3d8e2d34
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: AUTOPILOT_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: autopilot-core-credentials
                  key: AUTOPILOT_GITHUB_TOKEN
            - name: OPENCODE_URL
              value: http://127.0.0.1:4096
            # ops/models.json の役と揃える運用 (機械検査は未整備)。
            # 2026-08-25 に ox-alpha-free から差し替え。次候補は mimo-v2.5 / qwen3.7-plus
            - name: CORE_MODEL
              value: opencode-go/deepseek-v4-flash
            - name: CORE_STATE_DIR
              value: /data
            # 人間を待たせる時間はここで決まる (inbox に載ってからコアが読むまで)。
            # 5s * 720 req/h で共有トークンの上限 5000 req/h に十分収まる
            - name: CORE_POLL_SECONDS
              value: "5"
            # 健全性レポートは 30 分周期の CronJob が書くので速く見ても意味が無い
            - name: CORE_HEALTH_SECONDS
              value: "120"
            # MCP サイドカーの見張り。opencode は remote MCP を自動再接続せず、
            # サイドカーが再起動しても connected のままツールだけ黙って壊れる。
            # driver が boot 識別子の変化を見て POST /mcp/<name>/connect を叩く。
            # name は config.yaml の opencode.json のキーと一致させること
            - name: CORE_MCP_TARGETS
              value: telegram=http://127.0.0.1:4097,homelab=http://127.0.0.1:4098
            - name: CORE_MCP_CHECK_SECONDS
              value: "30"
            # main の作業コピー (/data/repo) を合わせ直す間隔。opencode コンテナへは
            # read-only で見せる。main は 1 時間に数回しか動かないので詰めても意味が無い
            - name: CORE_REPO_SYNC_SECONDS
              value: "300"
            # 立案の shadow 実行 (設計 rev3 Phase C)。**既定は無効。**
            # 有効にすると driver が planner → judge のサブエージェントを
            # 定期的に回し、結果を /data/shadow/curriculum.jsonl に記録する。
            # heart の curriculum Job はそのまま動き続け、判断は置き換えない
            # (突き合わせのための影実行)。副作用はゼロ — git にも PR にも
            # Telegram にも出さない。
            # 新しいコンテナは足さない: 思考は opencode コンテナ (cpu limit 1) の
            # 中で走り、driver は起動と記録だけを担う。node01 は 4 コアしかなく、
            # 2026-08-24 に autopilot の CPU 枯渇でノードごと落ちている
            - name: CORE_SHADOW_CURRICULUM
              value: "0"
            - name: CORE_SHADOW_INTERVAL_HOURS
              value: "6"
            # 常駐コアの transcript (P-9004) の書き先。autopilot-data を /shared
            # に rw で mount し、その transcripts/ へ resident/core.jsonl を書く
            # (dashboard が readOnly で読んでいるのと同じ PVC)。空にすると tee しない
            - name: CORE_RESIDENT_TRANSCRIPTS_DIR
              value: /shared/transcripts
            # イベント経路 (設計 D16) からの入力。GitHub の inbox と両読みで、
            # 同じ書き置きは cursor (/data/cursor.json) で 1 回に落とす。
            # この 2 つを消せば GitHub 側だけの構成に切り戻る
            - name: NATS_URL
              value: nats://nats.autopilot.svc:4222
            - name: NATS_NKEY_SEED
              valueFrom:
                secretKeyRef:
                  name: autopilot-core-credentials
                  key: NATS_CORE_NKEY_SEED
            - name: TZ
              value: Asia/Tokyo
          volumeMounts:
            - name: state
              mountPath: /data
            - name: resident-data
              mountPath: /shared
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: autopilot-core-config
        - name: work
          emptyDir: {}
        - name: state
          persistentVolumeClaim:
            claimName: autopilot-core-state
        # 常駐コアの transcript (P-9004) の書き先。heart と同じ autopilot-data
        # (RWO だが node01 は単一ノードなので同時 mount は成立する — pvc.yaml の
        # 注記どおり)。dashboard が readOnly で読むのと同じ PVC へ書く
        - name: resident-data
          persistentVolumeClaim:
            claimName: autopilot-data
        # k8s API 用の短命トークン。automountServiceAccountToken: false のまま
        # **必要なコンテナにだけ** 配るための形 (kubelet が既定で作るものと同じ中身)。
        # volumeMounts しているのは core-driver-mcp だけ
        - name: kube-api-access
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
