apiVersion: apps/v1
kind: Deployment
metadata:
  name: recovery-canary
  namespace: recovery-canary
  labels:
    app.kubernetes.io/name: recovery-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recovery-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recovery-canary
    spec:
      # 削除されることが仕事なので SA token は不要。k8s API に触れるのは
      # CronJob 側 (rbac.yaml の recovery-canary-probe) だけ
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pause
          # 何もしない infra コンテナ。削除 → selfHeal 再作成 → Ready の所要を
          # 測る対象であって中身は問わないため、依存も起動処理も無い最小のものに
          # する (測定対象が重いと「復旧」にイメージ pull 等の雑音が混ざる)
          image: registry.k8s.io/pause:3.10
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # memory limits は付けない (T-0055): pause の消費が極小であることは公知
          # だが一次計測していないので、実測裏付けの無い縛りを足さない。
          # requests も付けない — 単一ノードで他 workload への影響は実質零
