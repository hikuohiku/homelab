# telegram-adapter が必要とする credential を Doppler (homelab/prd) から取る。
# Requires: ClusterSecretStore 'doppler' (apps/external-secrets/cluster-secret-store.yaml)
#
# 参照してよいキーは ops/rules.json の allowed_autopilot_doppler_keys で縛られ、
# ops/validate.py (allowlist 方向) と ops/check_credential_map.py (双方向) が CI で検査する。
# 値そのものはこのリポジトリには置かない（Git には ExternalSecret の参照だけが載る）。
#
# openclaw-credentials からの差分:
#   OPENCLAW_GATEWAY_TOKEN — 不要になった (control plane を持たないため)。allowlist からも外す
#   OPENCODE_API_KEY       — 不要になった (このプロセスは LLM を呼ばない)
#
# 参照するキー:
#   TELEGRAM_BOT_TOKEN       — @BotFather 発行の bot トークン。getUpdates と sendMessage に使う
#   TELEGRAM_ALLOWED_USER_ID — 人間の Telegram 数値 user ID。この ID の private DM だけを
#                              取り込む。未解決なら誰にも一致しない = fail-closed
#   AUTOPILOT_GITHUB_TOKEN   — ops-feedback ブランチの inbox へ書くために流用する
#                              (P-0107 から継続。書き先は autopilot 専用ブランチの 1 ディレクトリのみ)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: telegram-adapter-credentials
  namespace: autopilot
spec:
  refreshInterval: 30m
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler
  target:
    name: telegram-adapter-credentials
    creationPolicy: Owner
    # トークンを差し替える運用のときに ExternalSecret を消しても Secret が残るように
    # Retain（他アプリの ExternalSecret と揃える）
    deletionPolicy: Retain
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_ALLOWED_USER_ID
      remoteRef:
        key: TELEGRAM_ALLOWED_USER_ID
    - secretKey: AUTOPILOT_GITHUB_TOKEN
      remoteRef:
        key: AUTOPILOT_GITHUB_TOKEN
