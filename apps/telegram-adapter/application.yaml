apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telegram-adapter
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hikuohiku/homelab.git
    targetRevision: HEAD
    path: apps/telegram-adapter
  destination:
    server: https://kubernetes.default.svc
    # autopilot の heart / dashboard と同じ namespace で稼働
    # (namespace 自体は apps/autopilot/namespace.yaml が管理)
    namespace: autopilot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
