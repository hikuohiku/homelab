apiVersion: apps/v1
kind: Deployment
metadata:
  name: telegram-adapter
  namespace: autopilot
  labels:
    app: telegram-adapter
spec:
  replicas: 1
  # Telegram の getUpdates は同一 bot token に対して消費者 1 つしか許さない
  # (並行すると 409 Conflict)。rolling 中の二重起動を避けるため Recreate。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: telegram-adapter
  template:
    metadata:
      labels:
        app: telegram-adapter
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          # 13e48bfe343046c91736f41c02a400d2b770d25b (PR #565 の merge commit) の
          # OCI index digest。registry API の docker-content-digest ヘッダで実測。
          # apps/telegram-adapter/app/** を変えたら同じ手順で digest を取り直すこと
          image: ghcr.io/hikuohiku/homelab-telegram-adapter@sha256:a434c0f2323be84465013bcc716481889e7a38e26884fc0bed6401ed343ed155
          terminationMessagePolicy: FallbackToLogsOnError
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: telegram-adapter-credentials
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_ALLOWED_USER_ID
              valueFrom:
                secretKeyRef:
                  name: telegram-adapter-credentials
                  key: TELEGRAM_ALLOWED_USER_ID
            # 受信を握り潰さないための最小限の定型応答。OpenClaw の LLM 応答を
            # 撤去した穴を埋めるだけのもので、内容の判断はしない。
            # 常駐コア (docs/design/event-driven-core) が入ったらコアの発話に置き換える。
            # 空文字にすると ack を送らない。
            - name: TELEGRAM_ACK_TEXT
              value: "受け取りました。内容は次の点検サイクルで読まれます。"
            # 書き置きの唯一の出口 (設計 state-out-of-git Phase 7 で GitHub 側を閉じた)。
            # 未設定だと起動しない — 出口が無いまま ack だけ返す状態を作らない
            - name: NATS_URL
              value: nats://nats.autopilot.svc:4222
            - name: NATS_NKEY_SEED
              valueFrom:
                secretKeyRef:
                  name: telegram-adapter-credentials
                  key: NATS_PRODUCER_NKEY_SEED
            - name: TZ
              value: Asia/Tokyo
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            # memory の limits は付けない（substrate の規則: 実測の裏付けなしに付けない。
            # 超過が回復不能な OOMKill になる。CPU limits は throttle で回復するため設定する）
            limits:
              cpu: 200m
          securityContext:
            # distroless/static:nonroot の既定 uid。書き込む先はどこにも無い
            # (cursor は Telegram 側 offset が持つため PVC を持たない)
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
